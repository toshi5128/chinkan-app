<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>賃管特訓</title>
<meta name="theme-color" content="#156552">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="賃管特訓">
<style>
:root{
  --bg:#f5f6f3;--card:#fff;--ink:#1c1f1d;--sub:#5d655f;--line:#e3e6e1;--brand:#156552;--brandbg:#e3f1ec;
  --ok:#1b8a5a;--okbg:#e6f4ec;--ng:#c8372d;--ngbg:#fdecea;--warn:#a86400;--warnbg:#fff3df;--track:#eceee9;
  --a:#2a78d6;--b:#8a4fd1;--c:#d9822b;--d:#1b8a5a;--e:#c2417a;--hero:#156552;--heroink:#156552;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141615;--card:#1d201e;--ink:#eef1ee;--sub:#a3aca5;--line:#2e332f;--brand:#4cc3a0;--brandbg:#15302a;
  --ok:#4cc38a;--okbg:#12291e;--ng:#f07167;--ngbg:#2e1513;--warn:#f0b04a;--warnbg:#2b2210;--track:#2a2e2b;
  --a:#6aa8f0;--b:#b48ae8;--c:#f0a45c;--d:#4cc38a;--e:#ea7fae;--hero:#1f6b56;--heroink:#1f6b56;
}}
:root[data-theme="dark"]{
  --bg:#141615;--card:#1d201e;--ink:#eef1ee;--sub:#a3aca5;--line:#2e332f;--brand:#4cc3a0;--brandbg:#15302a;
  --ok:#4cc38a;--okbg:#12291e;--ng:#f07167;--ngbg:#2e1513;--warn:#f0b04a;--warnbg:#2b2210;--track:#2a2e2b;
  --a:#6aa8f0;--b:#b48ae8;--c:#f0a45c;--d:#4cc38a;--e:#ea7fae;--hero:#1f6b56;--heroink:#1f6b56;
}
:root[data-theme="dark"]{color-scheme:dark}:root[data-theme="light"]{color-scheme:light}
.thm{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;font-size:15px;line-height:1}

/* 会話形式の講義（ラジオ風 2人）と図 */
.talk{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.tl{display:flex;gap:8px;align-items:flex-start}.tl.B{flex-direction:row-reverse}
.tl .who{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--brandbg)}
.tl.B .who{background:var(--warnbg)}
.tl .say{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 11px;font-size:15px;line-height:1.75;min-width:0;flex:0 1 auto;max-width:calc(100% - 40px);overflow-wrap:anywhere}
.tl.B .say{background:var(--warnbg);border-color:transparent}
.ankirow.now{background:var(--brandbg);border-radius:8px;outline:2px solid var(--brand)}
.tl.now .say{outline:3px solid var(--brand);outline-offset:1px;font-weight:600}.tl.now .who{transform:scale(1.15);box-shadow:0 0 0 2px var(--brand)}
.zu{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:var(--bg)}
.zu .zt{font-size:13px;font-weight:800;color:var(--brand);margin-bottom:8px}
.zrel{display:flex;flex-direction:column;gap:8px}
.zedge{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.znode{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:12px;font-weight:700;gap:2px}
.znode .ic{font-size:30px;line-height:1.1}
.zarrow{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--sub);min-width:84px;text-align:center}
.zarrow i{display:block;width:100%;height:2px;background:var(--brand);position:relative;margin-top:3px}.zarrow i:after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:8px solid var(--brand)}
.zsteps{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.zstep{flex:1 1 90px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:12px;position:relative}
.zstep .ic{font-size:22px}.zstep b{display:block;font-size:13px}.zstep small{color:var(--sub);display:block}
.zvs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zvs>div{background:var(--card);border-radius:10px;padding:8px;font-size:13px;border:2px solid var(--ok)}.zvs>div.r{border-color:var(--ng)}
.zvs b{display:block;margin-bottom:4px}.zvs ul{margin:0;padding-left:1.1em}
.znums{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.znums div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:12px}
.znums b{display:block;font-size:20px;color:var(--brand)}
.ztbl{overflow-x:auto}.ztbl table{border-collapse:collapse;width:100%;font-size:13px}.ztbl th,.ztbl td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
.ztbl th{color:var(--sub);font-size:12px}.ztbl .mo{color:var(--ok);font-weight:900;font-size:16px}.ztbl .mx{color:var(--ng);font-weight:900;font-size:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:12px 16px 24px}
header.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 6px;max-width:640px;margin:0 auto}
header.top img{width:30px;height:30px;border-radius:8px}
header.top h1{font-size:17px;margin:0;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 8px}
.small{font-size:12.5px;color:var(--sub);line-height:1.6}
.num{font-variant-numeric:tabular-nums}
.hero{display:flex;align-items:baseline;gap:6px}
.hero b{font-size:44px;line-height:1;color:var(--brand)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:var(--brand);color:#fff;text-align:center}
.btn.sec{background:var(--brandbg);color:var(--brand)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn:disabled{opacity:.5}
.btns{display:grid;gap:8px}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px}
.area{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:8px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.pickbar{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));z-index:6;padding:8px 12px;background:var(--card);border-top:2px solid var(--brand);box-shadow:0 -4px 12px rgba(0,0,0,.08)}
.pickbar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button.on{color:var(--brand);font-weight:700}
nav.tabs svg{width:22px;height:22px}
/* 一問一答 */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:8px}
.pbar{position:sticky;top:0;z-index:4;background:var(--bg);padding:6px 0 8px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.pbar .bt{flex:none;border:0;border-radius:8px;background:var(--brand);color:#fff;font-weight:700;font-size:13px;padding:7px 10px}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--track);color:var(--sub)}
.qtext{font-size:17px;line-height:1.75;margin:4px 0 14px;white-space:pre-wrap}
u.key{text-decoration:underline;text-decoration-color:var(--ng);text-decoration-thickness:2px;text-underline-offset:4px;font-weight:700}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 0;font-size:40px;font-weight:800;line-height:1}
.ox .o{color:var(--ok)}.ox .x{color:var(--ng)}
.ox button.pick{border-color:currentColor}
.res{border-radius:12px;padding:12px;margin-top:12px;line-height:1.7;font-size:15px}
.res.ok{background:var(--okbg)}.res.ng{background:var(--ngbg)}
.res b.t{font-size:17px}
.ref{font-size:12px;color:var(--sub);margin-top:6px}
.prog{height:5px;background:var(--track);border-radius:3px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--brand)}
.linkbtn{border:0;background:none;color:var(--brand);padding:6px 0;font-size:14px;text-decoration:underline}
/* 模試 */
.opts{display:grid;gap:8px}
.opts button{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:15px;line-height:1.6;display:flex;gap:10px}
.opts button .n{font-weight:800;color:var(--brand);min-width:1.2em}
.opts button.pick{border-color:var(--brand);background:var(--brandbg)}
.stmts{margin:4px 0 12px;display:grid;gap:8px}
.stmts div{font-size:15px;line-height:1.7;display:flex;gap:8px}
.stmts div>b{min-width:1.3em}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 0;font-size:12px}
.grid button.ans{background:var(--brandbg);border-color:var(--brand)}
.grid button.flag{outline:2px solid var(--warn)}
.grid button.cur{background:var(--brand);color:#fff}
.grid button.okk{background:var(--okbg);border-color:var(--ok)}
.grid button.ngg{background:var(--ngbg);border-color:var(--ng)}
.timer{font-weight:700}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.ng{background:var(--ngbg);color:var(--ng)}
details.st{border-top:1px solid var(--line);padding:8px 0}
details.st summary{cursor:pointer;font-size:14px;line-height:1.6}
.days{display:flex;align-items:flex-end;gap:3px;height:96px;margin-top:6px}
.days .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.days .col b{font-size:9.5px;font-weight:600;color:var(--sub);line-height:1.2;margin-bottom:2px;font-variant-numeric:tabular-nums}
.days .col i{display:block;width:100%;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.days .col.today b{color:var(--brand)}
.dtbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.dtbl td{padding:7px 4px;border-top:1px solid var(--line)}
.dtbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.dtbl tr.today td{font-weight:700;color:var(--brand)}
.dlab{display:flex;gap:3px;font-size:10px;color:var(--sub)}.dlab span{flex:1;text-align:center}
textarea{width:100%;min-height:90px;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px}
select,input[type=number]{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.ver{text-align:center;font-size:11px;color:var(--sub);margin-top:14px}
.center{text-align:center}
b.em{color:var(--brand);background:var(--brandbg);border-radius:4px;padding:0 2px;font-weight:800}
.spk{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--brand);font-weight:700}
.spk.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.player{display:flex;justify-content:center;gap:14px;margin-top:12px}
.player button{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px}
.player button.main{width:72px;height:72px;background:var(--brand);color:#fff;border:0;font-size:28px}
.mt{margin-top:10px}
</style>
</head>
<body>
<script>try { const t = localStorage.getItem("chinkan.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<header class="top"><img src="icon-192.png" alt=""><h1>賃管特訓</h1><span class="small" id="hdrDays"></span></header>
<main id="app"><div class="card small">問題を読み込み中…</div></main>
<nav class="tabs" id="tabs"></nav>

<script>
"use strict";
const APP_VERSION = "2026-10-31-v6.34";
const EXAM = new Date("2026-11-15T13:00:00+09:00");
const PASS_LINE = 38; // 令和7年度の合格点。目標ライン
const AREAS = {
  A: { name: "管理業法・受託契約", short: "管理業", color: "var(--a)", mock: 14 },
  B: { name: "サブリース規制",     short: "サブリース", color: "var(--b)", mock: 7 },
  C: { name: "維持保全（建物・設備）", short: "建物", color: "var(--c)", mock: 10 },
  D: { name: "賃貸借（民法・借地借家）", short: "賃貸借", color: "var(--d)", mock: 11 },
  E: { name: "金銭管理・実務", short: "実務", color: "var(--e)", mock: 8 },
};
const INTERVAL = [0, 1, 3, 7, 14, 30]; // 箱の番号 → 次に出すまでの日数
const LAST_WEEK = 7; // 最後の1週間は新しい問題を入れず、復習と模試に回す
const READ_END = "2026-10-25"; // 教科書1周目の締切（そのあと過去問期）
const PAST_URL = "https://www.chintaikanrishi.jp/exam/past";
const BOOK = "みんなが欲しかった！賃貸不動産経営管理士の教科書";
const BOOK_END = 455; // 最終Sectionの終わり（さくいんの手前）

// ---------- 保存 ----------
const KEY = "chinkan.v1";
let S = load();
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  s = s || {};
  s.cards = s.cards || {};   // id → {box,due,c,w,last,star}
  s.log = s.log || {};       // 日付 → {n,c}
  s.mocks = s.mocks || [];   // 模試の結果
  s.plan = s.plan || null;   // 今日の新規（その日の間は固定）
  s.read = s.read || {};     // 教科書のSection → 読んだ日
  s.readPlan = s.readPlan || null; // 今日読む所（その日の間は固定）
  s.pastCur = s.pastCur || null;   // 解いている途中の過去問（答案用紙）
  s.pastLog = s.pastLog || [];     // 過去問の採点結果
  s.lastBackup = s.lastBackup || null;
  s.newPerDay = s.newPerDay ?? 200; // 1日の新しい問題数（0＝おまかせ）。初期値は200問
  if (!s.pd200) { s.pd200 = 1; s._toPd200 = s.newPerDay !== 200; s.newPerDay = 200; }
  s.tts = Object.assign({ auto: true, rate: 1.2, think: 4, lecQuiz: true, lecMix: true }, s.tts || {});
  s.heard = s.heard || {};
  s.anki = s.anki || {}; // 暗記まとめで「覚えた」にした項目：テーマ|問い → 1
  s.autoNext = s.autoNext ?? true;
  if (!s.an65) { s.an65 = 1; s.autoNext = true; } // 2026-10-06 下田さんの端末でOFFになっていた → 一度だけONに戻す // 正解なら自動で次へ   // 講義を最後まで聞いた回数：Section → {n, last}
  s.lecPos = s.lecPos || null; // まとめて聞くの続き（どの一覧の、どこまで） // 読み上げの設定
  s.cur = s.cur || null;     // 受験中の模試
  s.rotate = s.rotate ?? true; // 新しい問題を章ごとの日替わりにする
  // 🆕 v6.16 解き直しの記録：前に間違えた問題を「別の日に」もう一度解いた最初の1回 → id → {d, ok}
  //   この版より前の分は記録から推定（10/14以降に2回以上解いて最後に解いた日が10/14以降のもの）
  s.redo = s.redo || {};
  if (!s.redoSeed) { s.redoSeed = 1; for (const [id, c] of Object.entries(s.cards || {})) if (c.w > 0 && c.c + c.w >= 2 && c.last >= "2026-10-14" && !s.redo[id]) s.redo[id] = { d: c.last, ok: !!c.lastOk }; }
  s.dojo = s.dojo || {};       // 過去問道場：問題id(R3-5等) → {c, w, last, lastOk, pick}
  s.dojoLog = s.dojoLog || {}; // 日付 → {n, c}
  s.done = s.done || {};     // 日付 → {count, mock, radio, nums}（今日の指示の✓に使う）
  s.syncKey = s.syncKey || (crypto.randomUUID ? crypto.randomUUID() : Array.from({ length: 32 }, () => "0123456789abcdef"[Math.random() * 16 | 0]).join(""));
  return s;
}
function save() { try { S.dsess = dsess; if (dsess?.year) { const P = S.dojoPos || (S.dojoPos = {}), i = dsess.i + (dsess.pick != null ? 1 : 0); P[dsess.year] = i < dsess.ids.length ? { i, ok: dsess.ok, done: dsess.done } : { i: 0 }; } } catch (e) {} try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { alertBox("保存できませんでした。記録タブからバックアップを取ってください。"); } cloudSoon(); }
// ---------- クラウドへ自動で控え（2026-10-06 下田さん「全てやって」）。保存のたびに20秒まとめて送る ----------
const CLOUD = "https://aevqdsozxiklyjfavvhf.supabase.co/functions/v1/chinkan";
let cloudTimer = null;
function cloudSoon() { clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudPush, 20000); }
async function cloudPush() {
  try {
    const r = await fetch(CLOUD, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "save", key: S.syncKey, data: { ...S, cur: null } }) });
    if (r.ok) { S.cloudAt = new Date().toISOString(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { clearTimeout(cloudTimer); cloudPush(); } });
async function cloudRestore() {
  const k = (document.getElementById("syncIn")?.value || "").trim().toLowerCase();
  if (!/^[0-9a-f-]{20,64}$/.test(k)) { alertBox("引き継ぎコードが正しくありません。"); return; }
  try {
    const r = await fetch(CLOUD, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "load", key: k }) }).then(x => x.json());
    if (!r.data) { alertBox("そのコードの記録が見つかりません。"); return; }
    if (!confirm(`${new Date(r.updated_at).toLocaleString("ja-JP")} の記録で、このスマホの記録を置き換えますか？`)) return;
    localStorage.setItem(KEY, JSON.stringify({ ...r.data, syncKey: k })); location.reload();
  } catch (e) { alertBox("読み込めませんでした。電波の良い所でもう一度。"); }
}
function CloudCard() {
  return `<div class="card"><h2>☁️ 記録の自動バックアップ</h2>
    <div class="small">勉強の記録は、解くたびに自動でクラウドに控えています${S.cloudAt ? `（最終 ${new Date(S.cloudAt).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}）` : ""}。スマホが壊れても記録は消えません。</div>
    <div class="small mt">機種変更のときは、新しいスマホでこの<b>引き継ぎコード</b>を入れると続きから使えます。</div>
    <div class="mt" style="font-family:monospace;font-size:12px;word-break:break-all;background:var(--bg);padding:8px;border-radius:8px">${esc(S.syncKey)}</div>
    <details class="mt"><summary class="small">別のスマホの記録を引き継ぐ</summary><input id="syncIn" placeholder="引き継ぎコード" style="width:100%;padding:10px;margin-top:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)"><button class="btn sec mt" onclick="cloudRestore()">この記録で続きから</button></details></div>`;
}

// ---------- 日付 ----------
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const daysLeft = () => Math.max(0, Math.ceil((new Date(ymd(EXAM) + "T00:00:00") - new Date(today() + "T00:00:00")) / 86400000));

let ZQ = [], Q = [], QM = {}, SECS = [], SECM = {}, CHAPS = [], PAST = null, NUMS = [], ANKI = [], CONF = [], LEC = {}, AUD = {}, TALK = {};
const LEC_FILES = ["lec_1a", "lec_1b", "lec_2", "lec_3", "lec_4", "lec_5"];
// 2026-10-05 下田さん「会話形式で・図やイラストでイメージしやすく」→ 講義をラジオ風の2人の会話＋図に（data/talk_*.json）。無いSectionは今までの講義のまま
const TALK_FILES = ["talk_1a", "talk_1b", "talk_2", "talk_3", "talk_4", "talk_5"];
const DATA_FILES = ["A", "B", "C", "D", "E", "X1", "X2", "X3", "X4", ...Array.from({ length: 11 }, (_, i) => "Y" + String(i + 1).padStart(2, "0"))];
async function loadQuestions() {
  const get = f => fetch(f, { cache: "no-store" }).then(r => r.ok ? r.json() : []).catch(() => []);
  const [chaps, past, nums, ...parts] = await Promise.all([get("sections.json"), get("data/past.json"), get("data/numbers.json"), ...DATA_FILES.map(f => get(`data/${f}.json`))]);
  PAST = past && past.years ? past : null;
  const lecs = await Promise.all(LEC_FILES.map(f => fetch(`data/${f}.json`, { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({}))));
  LEC = Object.assign({}, ...lecs);
  const talks = await Promise.all(TALK_FILES.map(f => fetch(`data/${f}.json`, { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({}))));
  TALK = Object.assign({}, ...talks);
  NUMS = Array.isArray(nums) ? nums : [];
  const KEYS = await fetch("data/keys.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  ANKI = await fetch("data/anki.json", { cache: "no-store" }).then(r => r.ok ? r.json() : []).catch(() => []);
  CONF = await fetch("data/confuse.json", { cache: "no-store" }).then(r => r.ok ? r.json() : []).catch(() => []);
  AUD = await fetch("audio/index.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  CHAPS = chaps;
  SECS = chaps.flatMap(c => c.secs.map(([id, title, page]) => ({ id, title, page, ch: c.ch })));
  SECS.forEach((x, i) => { x.pages = (SECS[i + 1]?.page || BOOK_END) - x.page; x.order = i; });
  SECM = Object.fromEntries(SECS.map(x => [x.id, x]));
  Q = parts.flat().filter(q => q && q.id && typeof q.a === "boolean");
  QM = Object.fromEntries(Q.map(q => [q.id, q]));
  // v6.32 苦手特訓（過去問のミスから作った新問題）。全問数・未挑戦の数がずれないよう Q には混ぜず、QM にだけ入れる
  ZQ = (await get("data/Z01.json")).filter(q => q && q.id && typeof q.a === "boolean"); ZQ.forEach(q => { q.z = 1; QM[q.id] = q; });
  Q.forEach(q => { if (KEYS && KEYS[q.id]) q.key = KEYS[q.id]; });
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const emph = s => esc(s).replace(/《(.+?)》/g, '<b class="em">$1</b>').replace(/[《》]/g, "");
const plain = s => String(s ?? "").replace(/[《》]/g, "");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const card = id => S.cards[id];

// 今日の分：期限が来た復習＋新しい問題（残り日数から逆算）
function autoQuota() {
  const unseen = Q.filter(q => !card(q.id)).length;
  // 教科書期は10/25までに一周（教科書と同じペース）、そのあとは試験1週間前まで
  const toRead = Math.round((new Date(READ_END + "T00:00:00") - new Date(today() + "T00:00:00")) / 86400000) + 1;
  const d = Math.max(1, toRead >= 1 ? toRead : daysLeft() - LAST_WEEK);
  return daysLeft() <= LAST_WEEK ? 0 : Math.min(unseen, Math.max(15, Math.ceil(unseen / d)));
}
function newQuota() {
  const unseen = Q.filter(q => !card(q.id)).length;
  return S.newPerDay ? Math.min(unseen, S.newPerDay) : autoQuota();
}
function setPerDay(n) {
  S.newPerDay = n;
  // 今日すでに解いた新しい問題は残し、残りを選び直す
  if (S.plan && S.plan.date === today()) {
    const done = S.plan.newIds.filter(id => card(id));
    S.plan = null; todayPlan(); // 未挑戦から選び直し（解いた分は含まれない）
    S.plan.newIds = [...done, ...S.plan.newIds.slice(0, Math.max(0, newQuota() - done.length))];
  }
  save(); render();
}
// おかわり：今日の分が終わったら、次の新しい問題を追加
function moreToday(n = 50) {
  todayPlan();
  const have = new Set(S.plan.newIds);
  const rank = q => (S.read[q.sec] ? 0 : 1000) + (SECM[q.sec]?.order ?? 999);
  const add = Q.filter(q => !card(q.id) && !have.has(q.id)).sort((a, b) => rank(a) - rank(b)).slice(0, n).map(q => q.id);
  if (!add.length) { alertBox("新しい問題はもうありません。全問に挑戦済みです！ 間違えた問題や苦手Sectionを繰り返しましょう。"); return; }
  S.plan.newIds.push(...add); save();
  startSession(add, `おかわり${add.length}問`);
}
const PerDaySeg = () => `<div class="seg">${[[0, `おまかせ（約${autoQuota()}問）`], [50, "50問"], [100, "100問"], [200, "200問"]].map(([n, l]) => `<button class="${S.newPerDay === n ? "on" : ""}" onclick="setPerDay(${n})">${l}</button>`).join("")}</div>`;
function todayPlan() {
  const t = today();
  if (!S.plan || S.plan.date !== t) {
    const quota = newQuota();
    // 教科書で読み終えたSectionの問題から、次に教科書の順（今日読む所が続く）
    const rank = q => (S.read[q.sec] ? 0 : 1000) + (SECM[q.sec]?.order ?? 999);
    let pool = Q.filter(q => !card(q.id));
    // 2026-10-06 下田さん「管理業法ばかり。日替わりで分野を回したい」→ 新しい問題は章ごとの日替わり（S.rotate、既定ON）。
    // その日の章を教科書の順に出し、足りなければ次の章で埋める。講義は全Sectionあるので、教科書を順に読み終えていなくても回せる
    if (S.rotate !== false) {
      const chs = [...new Set(SECS.map(x => x.ch))].filter(ch => pool.some(q => SECM[q.sec]?.ch === ch));
      if (chs.length) {
        const k = Math.floor((new Date(t + "T00:00:00") - new Date("2026-10-06T00:00:00")) / 86400000);
        const start = ((k % chs.length) + chs.length) % chs.length, order = [...chs.slice(start), ...chs.slice(0, start)];
        pool = pool.sort((a, b) => order.indexOf(SECM[a.sec]?.ch) - order.indexOf(SECM[b.sec]?.ch) || rank(a) - rank(b));
      }
    } else pool = pool.sort((a, b) => rank(a) - rank(b));
    const ids = pool.slice(0, quota).map(q => q.id);
    S.plan = { date: t, newIds: ids };
    save();
  }
  const newLeft = S.plan.newIds.filter(id => QM[id] && !card(id));
  const due = Q.filter(q => { const c = card(q.id); return c && c.due <= t; }).sort((a, b) => card(a.id).due.localeCompare(card(b.id).due)).map(q => q.id);
  return { newLeft, due, newTotal: S.plan.newIds.length, newDone: S.plan.newIds.length - newLeft.length };
}

function record(id, ok) {
  if (S.r2left && S.r2left.includes(id)) S.r2left = S.r2left.filter(x => x !== id); // 2周目の解き直し済み
  const t = today();
  // 前に間違えた問題を別の日に解いた最初の1回＝「解き直し」（同じ日の5問あとの再出題は数えない）
  const prev = S.cards[id];
  if (prev && prev.w > 0 && prev.last < t && !S.redo[id]) S.redo[id] = { d: t, ok };
  const c = S.cards[id] || { box: 0, c: 0, w: 0 };
  if (ok) { c.box = Math.min(5, Math.max(c.box, 1) + 1); c.c++; }
  else { c.box = 1; c.w++; }
  c.due = addDays(t, INTERVAL[c.box]);
  c.last = t; c.lastOk = ok;
  S.cards[id] = c;
  const L = S.log[t] || { n: 0, c: 0 }; L.n++; if (ok) L.c++; S.log[t] = L;
  save();
}

// 分野ごとの成績
function areaStats(a) {
  const qs = Q.filter(q => q.area === a);
  let seen = 0, mastered = 0, c = 0, w = 0;
  for (const q of qs) { const k = card(q.id); if (!k) continue; seen++; if (k.box >= 3) mastered++; c += k.c; w += k.w; }
  return { total: qs.length, seen, mastered, acc: c + w ? c / (c + w) : null };
}

const WEAK_DONE = 30; // 苦手がこの数以下になったら③は完了
function stageInfo() {
  const unseen = Q.filter(q => !card(q.id)).length;
  if (unseen > 0) { S.round1End = null; S.r2left = null; return { no: 1, title: "1周目：全部を通しで解く", sub: `残り ${unseen}問。解いていない問題がどこに何問あるか見て、選んで解けます。`, btn: "openPickUnseen()", label: "選んで解く", left: unseen }; }
  // 1周目が終わった瞬間に「間違えたことがある問題」を控え、解き直すたびに消していく
  if (!S.round1End || !S.r2left) { S.round1End = today(); S.r2left = Q.filter(q => card(q.id)?.w > 0).map(q => q.id); save(); }
  // v6.16: 残りの数は「🔁 解き直し」カードと同じ数え方（前に間違えた問題で、別の日にまだ解き直していないもの）
  const rs = redoStats();
  if (rs.left) return { no: 2, title: "2周目：間違えた問題を全部解き直す", sub: `間違えたことがある問題のうち、まだ解き直していない ${rs.left}問。間違えたら教科書のその部分を聞きましょう。`, btn: "startRedo()", label: "解き直す", left: rs.left };
  const weak = Q.filter(q => { const c = card(q.id); return c && (c.box <= 2 || c.w > c.c); }).length;
  if (weak > WEAK_DONE) return { no: 3, title: "3周目以降：「苦手」を空っぽにする", sub: `まだ覚えきれていない問題 ${weak}問。正解が続いた問題は自動で外れるので、${WEAK_DONE}問以下になるまで繰り返します。`, btn: "startWeakAll()", label: "苦手を解く", left: weak };
  const pastDone = new Set(S.pastLog.map(l => l.year)).size;
  if (pastDone < 5 || Object.values(S.done).filter(d => d.count).length < 3) return { no: 4, title: "本番の形に慣れる", sub: `公式の過去問 ${pastDone}/5年分（時間を計って50問）と、個数問題ドリル。間違えた問題のSectionを聞き直します。`, btn: "go('kako')", label: "過去問タブへ", left: 5 - pastDone };

}

  const done = tgt.filter(id => S.redo[id]), ok = done.filter(id => S.redo[id].ok).length;
  const td = done.filter(id => S.redo[id].d === t), tdOk = td.filter(id => S.redo[id].ok).length;
  const still = tgt.filter(id => card(id).lastOk === false).length;
  return { total: tgt.length, done: done.length, ok, acc: done.length ? ok / done.length : null, left: tgt.length - done.length, td: td.length, tdOk, still };
}

    if (r.data?.dojo && !S.dojoKey) dojoLoad(r.data.dojo).then(ok => { if (ok && (view === "kako" || view === "home")) render(); });

function pastFreq() { const m = {}; for (const y of PAST?.years || []) for (const q of y.qs) if (q.sec) m[q.sec] = (m[q.sec] || 0) + 1; return m; }
// 失点の大きい順＝(1−正答率)×(過去5年に出た数＋1)。9割以上のSectionは外す
function focusRank() {
  const f = pastFreq();
  return secStats().filter(x => x.c + x.w >= ACC_MIN && x.acc < 0.9).map(x => ({ ...x, freq: f[x.id] || 0, loss: (1 - x.acc) * ((f[x.id] || 0) + 1) })).sort((a, b) => b.loss - a.loss);
}
// 苦手Sectionは間違えたことがある問題→覚えきれていない問題の順に30問まで（83問・109問のSectionもあるため）
const FOCUS_N = 30;
function focusIds(sec) {

  return secQs(sec).map(q => [q, sc(q) + Math.random()]).sort((a, b) => b[1] - a[1]).slice(0, FOCUS_N).map(([q]) => q.id);

const idsDoneToday = ids => ids.length > 0 && ids.filter(id => card(id)?.last === today()).length >= Math.ceil(ids.length * 0.8);

const onceIds = () => Q.filter(q => { const c = card(q.id); return c && c.c + c.w === 1; }).map(q => q.id);
function startOnce() { const N = naviDay(), ids = onceIds(), fset = new Set(N.focus); startSession(ids.sort((a, b) => (fset.has(QM[b].sec) ? 1 : 0) - (fset.has(QM[a].sec) ? 1 : 0) || bookOrder(a, b)).slice(0, Math.max(10, N.onceQ - (N.onceBase - ids.length))), "2周目（1回しか解いていない問題）"); }
// その日の中身は朝いちど決めて固定する（解いて正答率が変わっても、今日の苦手Sectionが入れ替わらないように）。コーチの判断が後から届いたら組み直す
function naviDay() {
  const t = today();
  if (S.navi?.date === t && (COACH?.date !== t || S.navi.coach)) return S.navi;
  const r = redoStats(), d = daysTo(REDO_END), hist = S.naviHist || {};

  const nFocus = past || MOCK_PLAN.includes(t) ? 1 : 2;
  const recent = sec => hist[sec] && hist[sec] >= addDays(t, -3) && hist[sec] < t;
  const fromCoach = COACH?.date === t ? (COACH.focus || []).filter(s => SECM[s]) : [];
  const focus = [...new Set([...fromCoach, ...focusRank().filter(x => !recent(x.id)).map(x => x.id)])].slice(0, nFocus);
  const redoQ = S.navi?.date === t ? S.navi.redoQ : r.left ? (d > 0 ? Math.ceil((r.left + r.td) / d) : r.left + r.td) : 0;

}

function naviPastRev(y) { const dd = S.done[today()] || (S.done[today()] = {}); dd.pastRev = true; save(); if (DOJO) dojoPastWrong(y); else studyWrongSecs(y); }

// ---------- 予想得点（○×の正解率 → 本番の4択の点数） ----------
// 4択は4つの文をほぼ全部判断できないと取れない。個数・組合せ問題（約3割）は4つ全部。わからない問題も4分の1は当たる
// 「今の正解率のまま全範囲をやったら何点か」を出す。まだ解いていない分野は、全体の正解率で埋める（当てずっぽう扱いにしない）
// 解いた数が少ない分野は、全体の正解率に寄せてブレを抑える（10問ぶんの重み）
function predict() {
  const pAt = x => { const k = 0.72 * x ** 3 + 0.28 * x ** 4; return k + (1 - k) * 0.25; };
  const st = {}; let seenAll = 0, accSum = 0;
  for (const a of Object.keys(AREAS)) { st[a] = areaStats(a); seenAll += st[a].seen; if (st[a].acc != null) accSum += st[a].acc * st[a].seen; }
  const overall = seenAll ? accSum / seenAll : 0.5;
  let total = 0, raw = 0; const by = {};
  for (const [a, A] of Object.entries(AREAS)) {
    const s = st[a], cov = s.total ? s.seen / s.total : 0, acc = s.acc ?? overall;
    const pNow = (s.seen * acc + 10 * overall) / (s.seen + 10);
    const pts = A.mock * pAt(pNow), best = A.mock * pAt(Math.max(pNow, 0.95));
    raw += A.mock * pAt(cov * acc + (1 - cov) * 0.5);
    by[a] = { pts, gain: best - pts, acc: s.acc, cov }; total += pts;
  }
  return { total, raw, by, seenAll, overall };
}
function PredictCard() {
  const P = predict();
  if (P.seenAll < 100) return `<div class="card"><h2>予想得点</h2><div class="small">100問ほど解くと、今の実力なら本番で何点取れそうかを出します（今 ${P.seenAll}問）。</div></div>`;
  const score = Math.round(P.total), ok = score >= PASS_LINE;
  // まだ手を付けていない分野は計画どおり後で回るので、半分以上解いた分野の中から「苦手」を勧める
  const top = Object.entries(P.by).filter(([, b]) => b.cov >= 0.5 && b.acc != null && b.acc < 0.95).sort((x, y) => y[1].gain - x[1].gain).slice(0, 2).filter(([, b]) => b.gain >= 0.5);
  return `<div class="card"><h2>予想得点（今の正解率のままなら）</h2>
    <div class="row" style="align-items:baseline;gap:6px"><b class="num" style="font-size:40px;color:${ok ? "var(--ok)" : "var(--ng)"}">${score}</b><span>点</span><span class="grow"></span><span class="small">合格ライン ${PASS_LINE}点（${ok ? "到達" : `あと${PASS_LINE - score}点`}）</span></div>
    <div class="bar mt" style="height:10px;position:relative"><i style="width:${Math.min(100, score * 2)}%;background:${ok ? "var(--ok)" : "var(--ng)"}"></i></div>
    <div class="small mt">今までの○×の正解率（${Math.round(P.overall * 100)}%）のまま全範囲を仕上げた場合の、本番4択（個数問題を含む）での目安です。○×で9割を超えると、合格ラインに届きやすくなります。${P.seenAll < Q.length ? `<br>まだ解いていない問題（${Q.length - P.seenAll}問）も同じ正解率で数えています。まだ解いていない問題を勘で答えた場合（今日いきなり本番を受けたら）は約${Math.round(P.raw)}点です。全部解き終わると、この2つの数字は同じになります。` : ""}</div>
    <div class="mt" style="font-weight:700;font-size:14px">🎯 作戦表（目標 ${PASS_LINE + 2}点＝合格点＋2点の安全圏）</div>
    <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:4px">
      <tr style="color:var(--sub)"><td>分野</td><td class="num">本番</td><td class="num">今の予想</td><td class="num">目標</td><td class="num">あと</td></tr>
      ${Object.entries(AREAS).map(([a, A]) => { const goal = Math.ceil(A.mock * (PASS_LINE + 2) / 50), now = P.by[a].pts, gap = goal - now;
        return `<tr style="border-top:1px solid var(--line)"><td><span class="dot" style="background:${A.color}"></span>${A.short}</td><td class="num">${A.mock}問</td><td class="num">${now.toFixed(1)}</td><td class="num">${goal}</td><td class="num" style="color:${gap > 0.5 ? "var(--ng)" : "var(--ok)"};font-weight:700">${gap > 0.5 ? "+" + gap.toFixed(1) : "✓"}</td></tr>`; }).join("")}
    </table>
    ${top.length ? `<div class="mt" style="font-weight:700;font-size:14px">点を伸ばしやすい分野</div>${top.map(([a, b]) => `<div class="row" style="border-top:1px solid var(--line);padding:8px 0;gap:8px"><span class="dot" style="background:${AREAS[a].color}"></span>
      <div class="grow" style="font-size:14px">${AREAS[a].name}<div class="small">正答率 ${b.acc == null ? "—" : Math.round(b.acc * 100) + "%"}・挑戦 ${Math.round(b.cov * 100)}%・伸びしろ 約+${b.gain.toFixed(1)}点</div></div>
      <button class="btn sec" style="width:auto;padding:7px 12px;font-size:13px" onclick="startArea('${a}','weak')">苦手を解く</button></div>`).join("")}` : `<div class="small mt">分野ごとに半分以上解き進めると、点を伸ばしやすい分野をここに出します。</div>`}</div>`;
}

// 1Sectionの目安の分数（日本語の読み上げは1倍速でおよそ1分360字）。問題5問は1問約35秒
function lecMin(id, mix) {
  const L = LEC[id]; if (!L) return 0;
  if (AUD[id]?.lec) return (AUD[id].lec + (mix ? AUD[id].q || 0 : 0)) / 60 / S.tts.rate;
  const ch = L.intro.length + L.summary.length + L.points.reduce((s2, p) => s2 + p.h.length + p.t.length, 0);
  return ch / (360 * S.tts.rate) + (mix && secQs(id).length ? 5 * (35 + S.tts.think) / 60 : 0);
}
const fmtMin = m => m >= 60 ? `約${Math.floor(m / 60)}時間${Math.round(m % 60) ? Math.round(m % 60) + "分" : ""}` : `約${Math.max(1, Math.round(m))}分`;
function bundleIds(kind) {

  if (kind === "weak") return secStats().filter(x => x.c + x.w >= 4 && x.acc < 0.8).sort((a, b) => a.acc - b.acc).map(x => x.id).filter(id => LEC[id]);
  if (kind === "unread") return all.filter(id => !S.read[id]);
  if (kind === "read") return all.filter(id => S.read[id]);
  return all.filter(id => SECM[id]?.ch === +kind);
}

// ---------- 教科書 ----------
const secQs = id => Q.filter(q => q.sec === id);
function readEnd() {
  if (!S.newPerDay) return READ_END;
  const unseen = Q.filter(q => !card(q.id)).length;
  if (!unseen) return addDays(today(), -1);
  const end = addDays(today(), Math.ceil(unseen / S.newPerDay) - 1);
  return end < READ_END ? end : READ_END;
}
const mdj = d => `${+d.slice(5, 7)}/${+d.slice(8)}`;
function readPlan() {
  const t = today();
  if (!S.readPlan || S.readPlan.date !== t) {
    // まず「今日解く新しい問題が出るSection」のうち、まだ読んでいない所＝今日読む所（読む・聞く・解くを同じ範囲に）
    todayPlan();
    const sync = [...new Set(S.plan.newIds.map(id => QM[id]?.sec).filter(Boolean))]
      .filter(id => !S.read[id] && SECM[id]).sort((a, b) => SECM[a].order - SECM[b].order);
    if (sync.length) { S.readPlan = { date: t, ids: sync, sync: true }; save(); return S.readPlan; }
    const RE = readEnd();
    const left = SECS.filter(x => !S.read[x.id]);
    const days = Math.max(1, Math.round((new Date(RE + "T00:00:00") - new Date(t + "T00:00:00")) / 86400000) + 1);
    const leftPages = left.reduce((s, x) => s + x.pages, 0);
    const target = t > RE ? Infinity : Math.ceil(leftPages / days);
    const ids = []; let pg = 0;
    // 1日分のページ数に届くまでSectionを順に。半分以上はみ出すSectionは翌日へ
    for (const x of left) { if (ids.length && (t > RE || pg + x.pages / 2 > target)) break; ids.push(x.id); pg += x.pages; }
    S.readPlan = { date: t, ids, target: isFinite(target) ? target : 0 };
    save();
  }
  return S.readPlan;
}

// ---------- 範囲を選んで解く（2026-10-06 下田さん「出題範囲を自分で選べるように」） ----------
// 章・Sectionを選ぶ → どの問題（全部/未挑戦/苦手/★）→ 何問 → 順番。選んだ範囲は次に開いた時も残る
const ACC_MIN = 4;
const accColor = a => a == null ? "var(--sub)" : a < 0.7 ? "var(--ng)" : a < 0.85 ? "var(--warn)" : "var(--ok)";
const accText = (c, w) => c + w >= ACC_MIN ? Math.round(c / (c + w) * 100) + "%" : "—";
function secAccMap() { const m = {}; for (const x of secStats()) m[x.id] = x; return m; }
// まだ解いていない問題がある所を全部選んで「未挑戦」に（2026-10-06 下田さん「まだ解いてない問題を出すのも」）
function pickUnseen() { const P = pickState(); P.secs = SECS.filter(x => secQs(x.id).some(q => !card(q.id))).map(x => x.id); P.mode = "new"; P.order = "book"; save(); render(); }

  P.open = SECS.find(x => secQs(x.id).some(q => !card(q.id)))?.ch || 1;
  save(); view = "study"; studyMenu = true; render(); window.scrollTo(0, 0);
}
function pickWeak() { const P = pickState(); P.secs = secStats().filter(x => x.c + x.w >= ACC_MIN && x.acc < 0.85).map(x => x.id); P.mode = "weak"; save(); render(); }
function pickState() { return S.pick || (S.pick = { secs: [], open: 1, mode: "all", n: 30, order: "rand" }); }
// 2026-10-10 下田さん「1回間違えた・2回間違えた・3回間違えた問題で出せるように（復習用）」
//   wn: 0=1回以上（全部） / 1=ちょうど1回 / 2=ちょうど2回 / 3=3回以上
function wrongMatch(c, wn) {
  const w = (c && c.w) || 0;
  if (!w) return false;
  if (!wn) return true;
  return wn >= 3 ? w >= 3 : w === wn;
}
function pickWrongAll(wn) { const P = pickState(); P.secs = SECS.map(x => x.id); P.mode = "wrong"; P.wn = wn || 0; save(); render(); }
function pickQs() {
  const P = pickState(), set = new Set(P.secs);
  let qs = Q.filter(q => set.has(q.sec));
  if (P.mode === "new") qs = qs.filter(q => !card(q.id));
  if (P.mode === "weak") qs = qs.filter(q => { const c = card(q.id); return c && (c.box <= 2 || c.w > 0); });
  if (P.mode === "star") qs = qs.filter(q => card(q.id)?.star);
  if (P.mode === "wrong") qs = qs.filter(q => wrongMatch(card(q.id), P.wn)); // 2026-10-06 下田さん「過去に間違えた問題だけ出せるように」＝1回でも間違えたことがある問題
  return qs;
}
function pickToggle(id) { const P = pickState(); P.secs = P.secs.includes(id) ? P.secs.filter(x => x !== id) : [...P.secs, id]; save(); render(); }
function pickCh(ch, on) { const P = pickState(), ids = SECS.filter(x => x.ch === ch).map(x => x.id); P.secs = on ? [...new Set([...P.secs, ...ids])] : P.secs.filter(x => !ids.includes(x)); save(); render(); }

}

function startArea(a, mode) {
  let qs = Q.filter(q => q.area === a);
  if (mode === "weak") qs = qs.filter(q => { const c = card(q.id); return c && (c.box <= 2 || c.w > 0); });
  if (mode === "new") qs = qs.filter(q => !card(q.id));
  startSession(shuffle(qs).slice(0, 30).map(q => q.id), AREAS[a].short + (mode === "weak" ? "・苦手" : mode === "new" ? "・未挑戦" : ""));
}
function startSpecial(kind) {
  let qs = kind === "star" ? Q.filter(q => card(q.id)?.star) : Q.filter(q => { const c = card(q.id); return c && c.w > 0 && c.box <= 2; });
  startSession(shuffle(qs).slice(0, 40).map(q => q.id), kind === "star" ? "★マーク" : "間違えた問題");

// ---------- 間違えた時：その問題に関係する教科書（講義）の部分を問題の上に出して、すぐ聞けるようにする ----------
// 問題文と解説に出てくる言葉（漢字・カタカナ2文字以上）が、講義のどのかたまりに一番多く出るかで選ぶ
function relatedBlock(q) {
  const bl = lecBlocks(q.sec); if (!bl.length) return -1;
  const words = [...new Set(((q.q || "") + (q.exp || "")).match(/[一-龯々ァ-ヶー]{2,}/g) || [])];
  let best = -1, bestScore = 0;
  bl.forEach((b, i) => { const t = b.t || ""; const sc = words.reduce((n, w) => n + (t.includes(w) ? w.length : 0), 0) * (i === 0 || i === bl.length - 1 ? 0.6 : 1); if (sc > bestScore) { bestScore = sc; best = i; } });

  const by = {}; m.items.forEach((it, k) => { const b = by[it.area] || (by[it.area] = { n: 0, c: 0 }); b.n++; if (m.pick[k] === it.ans) b.c++; });
  return `
  <div class="card center"><div class="small">模試の結果</div>
    <div class="hero" style="justify-content:center"><b class="num" style="color:${pass ? "var(--ok)" : "var(--ng)"}">${m.score}</b><span>/ ${m.items.length}点</span></div>
    <div class="mt"><span class="tag ${pass ? "ok" : "ng"}">${full ? (pass ? "目標ライン到達" : `目標まであと${PASS_LINE - m.score}点`) : `正答率 ${Math.round(m.score / m.items.length * 100)}%（目標76%）`}</span></div>
    <div class="small mt">かかった時間 ${Math.round((m.end - m.start) / 60000)}分</div></div>
  <div class="card"><h2>分野別</h2>${Object.entries(by).map(([a, b]) => `<div class="area"><div><span class="dot" style="background:${AREAS[a].color}"></span>${AREAS[a].name}</div><div class="num small">${b.c}/${b.n}</div>
    <div class="bar" style="grid-column:1/-1"><i style="width:${b.c / b.n * 100}%;background:${AREAS[a].color}"></i></div></div>`).join("")}</div>
  ${m.spent ? MockTime(m) : ""}
  <div class="card"><h2>1問ずつ見直す</h2><div class="small">タップすると、4つの文それぞれの○×と解説が出ます。</div>
    ${m.items.map((it, k) => { const ok = m.pick[k] === it.ans;
      const label = o => it.opts ? it.opts[o] : String(o + 1);
      return `<details class="st"><summary><span class="tag ${ok ? "ok" : "ng"}">${ok ? "正解" : "×"}</span> 問${k + 1} ${STEM[it.type]}<span class="small">（あなた：${m.pick[k] === null ? "未解答" : label(m.pick[k])}／正解：${label(it.ans)}）</span></summary>
        ${it.ids.map((id, j) => { const q = QM[id]; return `<div style="margin:8px 0 0;font-size:14px;line-height:1.7"><b>${it.opts ? KANA[j] : j + 1}</b> ${gl(q.q)}<br>
          <span class="tag ${q.a ? "ok" : "ng"}">${q.a ? "○ 正しい" : "× 誤り"}</span> <span class="small">${gx(q)}</span></div>`; }).join("")}</details>`; }).join("")}
    <div class="btns mt"><button class="btn" onclick="S.cur=null;save();go('home')">閉じる</button></div></div>`;
}

function MockTime(m) {
  const min = x => x / 60000, per = m.items.length >= 40 ? 120 / 50 : (m.limit || 1200) / 60 / m.items.length;
  const by = {}; m.items.forEach((it, k) => { const b = by[it.area] || (by[it.area] = { n: 0, t: 0 }); b.n++; b.t += m.spent[k] || 0; });
  const slow = m.items.map((it, k) => ({ k, t: m.spent[k] || 0 })).sort((a, b) => b.t - a.t).slice(0, 5);
  return `<div class="card"><h2>⏱ 時間の使い方</h2><div class="small">本番は1問あたり約${per.toFixed(1)}分。それより時間を使った分野は、迷いが多い＝まだあやふやな所です。</div>
    ${Object.entries(by).map(([a, b]) => { const avg = min(b.t) / b.n, over = avg > per * 1.15; return `<div class="row" style="border-top:1px solid var(--line);padding:7px 0"><span class="dot" style="background:${AREAS[a].color}"></span><span class="grow" style="font-size:14px">${AREAS[a].name}</span><span class="num small" style="color:${over ? "var(--ng)" : "var(--sub)"}">1問 ${avg.toFixed(1)}分${over ? " 遅め" : ""}</span></div>`; }).join("")}
    <div class="small mt">いちばん時間を使った問題：${slow.map(x => `問${x.k + 1}（${min(x.t).toFixed(1)}分）`).join("・")}</div></div>`;
}

// ---------- 個数問題ドリル（「正しいものはいくつ」と組合せだけ。間違えた文を優先） ----------
// 2026-10-06 下田さん「個数問題ドリルはやりたい時にやるので切り離して」→ 一問一答タブと模試タブに独立したメニュー
function cdState() { return S.cd || (S.cd = { range: "all", n: 10 }); }
function startCountDrill() {
  const C = cdState(), n = C.n || 10;
  const inPick = new Set(pickState().secs);
  const scope = C.range === "pick" && inPick.size ? Q.filter(q => inPick.has(q.sec)) : Q;
  const seen = scope.filter(q => card(q.id)), weak = seen.filter(q => card(q.id).w > 0 && card(q.id).box <= 2);
  const base = C.range === "weak" ? (weak.length >= 16 ? [...weak, ...shuffle(seen).slice(0, 60)] : [...weak, ...shuffle(seen).slice(0, 200)])
    : seen.length >= 40 ? [...weak, ...shuffle(seen).slice(0, 200)] : scope;
  const pool = base.length >= 16 ? base : scope; // 解いた問題がまだ少ない時は範囲全体から
  const used = new Set(), items = [];
  for (let i = 0; items.length < n && i < n * 4; i++) { const it = makeItem(null, i % 3 === 2 ? "combo" : "count", used, pool); if (it) items.push(it); }
  if (items.length < 5) { alertBox("問題がまだ少ないため、個数ドリルを作れません。"); return; }
  S.cur = { items, pick: items.map(() => null), flag: items.map(() => false), i: 0, start: Date.now(), done: false, limit: n * 120, kind: "count" };
  save(); go("mock");
}

function CountCard() {
  const C = cdState(), runs = Object.values(S.done).filter(d => d.count).length, hasPick = pickState().secs.length > 0;
  const seg = (k, opts) => `<div class="seg mt">${opts.map(([v, l]) => `<button class="${C[k] === v ? "on" : ""}" onclick="cdState()['${k}']=${JSON.stringify(v).replace(/"/g, "'")};save();render()">${l}</button>`).join("")}</div>`;
  return `<div class="card"><h2>🔢 個数問題ドリル</h2>
    <div class="small">「正しいものはいくつあるか」と組合せの問題だけを出します。4つの文を全部判断する練習です（1問2分）。${runs ? `これまで${runs}日やりました。` : ""}</div>
    <div class="small mt">範囲</div>${seg("range", [["all", "全範囲"], ...(hasPick ? [["pick", "範囲選びで選んだ所"]] : []), ["weak", "間違えた文を多めに"]])}
    <div class="small mt">問数</div>${seg("n", [[10, "10問・20分"], [20, "20問・40分"]])}
    <div class="btns mt"><button class="btn" onclick="startCountDrill()">▶ 個数ドリルを始める</button></div></div>`;
}

const PAST_DAYS = { "2026-10-27": "R3", "2026-10-29": "R4", "2026-10-31": "R5", "2026-11-03": "R6", "2026-11-06": "R7" };
function coachPlan() {
  const d = today(), dd = S.done[d] || {}, dl = daysLeft(), sun = new Date(d + "T00:00:00").getDay() === 0, p = todayPlan();

  if (d === ymd(EXAM)) {
    return { phase: "本番当日", msg: "ここまで本当によくやりました。今日は新しいことはしません。", items: [
      { done: false, title: "朝：数字まとめを10分だけ眺める", sub: "覚え直しではなく、確認だけ", btn: "go('numbers')", label: "数字まとめ" },

  if (dl <= LAST_WEEK) {
    const ch = ((LAST_WEEK - dl) % 5) + 1;
    add(!!dd.radio, `📻 総まとめラジオ 第${ch}章`, "移動中に聞く。章を毎日ずらして全範囲を回す", `startRadio(${ch})`, "聞く");

    if (y) add(done, `📝 過去問 ${pastYear(y)?.label || y}（50問・120分）`, "紙で時間を計って解き、答えだけアプリに入れる。間違えたSectionの講義を聞き直す", `startPast('${y}')`, "答案用紙");
    add(todayDone, "✏️ 今日の復習＋新しい問題", `残り${p.newLeft.length + p.due.length}問`, "startToday()", "解く");

    if (!y && !sun) add(!!dd.nums, "🔢 数字まとめ（答えを隠して）", "5分でOK", "go('numbers')", "開く");

    add(todayDone, "✏️ 今日の問題（新しい問題＋復習）", `新しい問題 ${p.newDone}/${p.newTotal}・復習 残り${p.due.length}問`, "startToday()", "解く");

// ---------- 記録 ----------
function Stats() {
  const days = []; for (let i = 13; i >= 0; i--) days.push(addDays(today(), -i));
  // v6.30 下田さん「過去問を解いた時も学習量に記録しないとダメじゃない？」→ 一問一答＋過去問（1問＝1問）で数える
  const pn = d => S.dojoLog?.[d]?.n || 0, an = d => (S.log[d]?.n || 0) + pn(d), ac = d => (S.log[d]?.c || 0) + (S.dojoLog?.[d]?.c || 0);
  const max = Math.max(10, ...days.map(an));
  let streak = 0; for (let d = today(); an(d); d = addDays(d, -1)) streak++;
  const pastTotal = Object.values(S.dojoLog || {}).reduce((s, l) => s + l.n, 0), total = Object.values(S.log).reduce((s, l) => s + l.n, 0) + pastTotal;
  // 2026-10-10 下田さん「1日の平均問題数も出して」
  const studied = [...new Set([...Object.keys(S.log), ...Object.keys(S.dojoLog || {})])].filter(d => an(d) > 0).sort();
  const first = studied[0];
  const sinceDays = first ? Math.round((new Date(today() + "T00:00:00") - new Date(first + "T00:00:00")) / 86400000) + 1 : 0;
  const last7 = days.slice(-7).reduce((s2, d) => s2 + an(d), 0);
  const avgStudy = studied.length ? Math.round(total / studied.length) : 0;
  const avgAll = sinceDays ? Math.round(total / sinceDays) : 0;
  const avg7 = Math.round(last7 / 7);
  const unseen = Q.filter(q => !card(q.id)).length, dl = daysLeft();
  const need = unseen && dl ? Math.ceil(unseen / dl) : 0;
  const tile = (v, l) => `<div style="flex:1;min-width:0;text-align:center;background:var(--bg);border-radius:10px;padding:8px 4px"><div class="num" style="font-size:22px;font-weight:800">${v}</div><div class="small">${l}</div></div>`;
  return `
  <div class="card"><h2>毎日の学習量（14日）</h2>

    return `<div class="area"><div><span class="chip">CH${c.ch}</span> ${esc(c.title)}</div><div class="num small">${b.c}/${b.n}</div>
      <div class="bar" style="grid-column:1/-1"><i style="width:${b.c / b.n * 100}%;background:var(--brand)"></i></div></div>`; }).join("")}</div>
  <div class="card"><h2>間違えた問題（${wrongs.length}問）</h2>
    <div class="small">問題PDFで解説を確認したら、教科書の該当ページを読み直しましょう。</div>
    ${wrongs.map(({ q, i }) => { const x = SECM[q.sec];
      return `<div style="border-top:1px solid var(--line);padding:8px 0"><div class="row"><b class="num" style="width:44px">問${q.no}</b><span class="grow" style="font-size:14px">${esc(q.topic)}</span>
        <span class="small">あなた ${cur.pick[i] ?? "—"}／正解 <b>${ansTxt(q.ans)}</b></span></div>
        <div class="small" style="margin-left:44px">${x ? `教科書 ${x.id} ${esc(x.title)}（p.${x.page}〜）` : ""}${q.note ? `<br>⚠ ${esc(q.note)}` : ""}</div></div>`; }).join("")}
    <div class="btns mt">${wrongs.length && DOJO ? `<button class="btn" onclick="dojoPastWrong('${y.year}')">🥋 間違えた${wrongs.length}問を解説つきで解き直す</button>` : ""}${wrongs.length ? `<button class="btn ${DOJO ? "sec" : ""}" onclick="studyWrongSecs('${y.year}')">間違えたSectionの一問一答を解く</button>` : ""}
    <button class="btn ghost" onclick="S.pastCur=null;save();go('kako')">閉じる</button></div></div>`;
}

// ---------- 数字まとめ ----------
let numCh = 1, numHide = false, numOpen = {};
function sayNums() {
  const list = NUMS.filter(x => SECM[x.sec]?.ch === numCh);
  TTS.speak(list.map(x => `${x.item}。${x.num}。`).join(""));
}
function Numbers() {
  if (!NUMS.length) return `<div class="card">数字まとめは準備中です。</div>`;
  { const dd = S.done[today()] || (S.done[today()] = {}); if (!dd.nums) { dd.nums = true; setTimeout(save, 0); } }
  const list = NUMS.filter(x => SECM[x.sec]?.ch === numCh);
  return `<div class="card"><h2>🔢 数字まとめ</h2><div class="small">本番は数字のひっかけが多い試験です。「答えを隠す」にすると、タップするまで数字が見えないので暗記テストになります。</div>
    <div class="row mt" style="gap:6px;flex-wrap:wrap">${CHAPS.map(c => `<button class="chip" style="border:0;padding:6px 12px;font-size:13px;${numCh === c.ch ? "background:var(--brand);color:#fff" : ""}" onclick="numCh=${c.ch};numOpen={};render()">CH${c.ch}</button>`).join("")}
      <span class="grow"></span><button class="linkbtn" onclick="numHide=!numHide;numOpen={};render()">${numHide ? "答えを表示" : "答えを隠す"}</button></div>
    ${TTS.ok ? `<div class="mt"><button class="btn sec" onclick="sayNums()">🎧 CH${numCh}の数字を通しで聞く</button></div>` : ""}</div>
  <div class="card">${list.map((x, i) => { const shown = !numHide || numOpen[i];
    return `<div style="border-top:${i ? "1px solid var(--line)" : "0"};padding:9px 0" ${numHide ? `onclick="numOpen[${i}]=!numOpen[${i}];render()"` : ""}>
      <div class="small"><b class="num">${esc(x.sec)}</b> ${esc(SECM[x.sec]?.title || "")}</div>
      <div style="font-weight:700;font-size:14.5px;margin-top:2px">${esc(x.item)}</div>
      <div style="font-size:15px;margin-top:2px;color:${shown ? "var(--brand)" : "var(--sub)"}">${shown ? esc(x.num) : "（タップで表示）"}</div>
      ${shown && x.tip ? `<div class="small">💡 ${esc(x.tip)}</div>` : ""}</div>`; }).join("") || `<div class="small">この章の数字はまだありません。</div>`}</div>
  <div class="center"><button class="linkbtn" onclick="go('book')">◀ 教科書に戻る</button></div>`;
}

// ---------- 暗記まとめ ----------
// 2026-10-07 下田さん「罰則の罰金とか暗記系がまったくだめ。暗記しないといけないものをまとめて教科書に入れて」
// テーマ別（罰則は罰則だけ・期間は期間だけ）に1か所へ集める。答えを隠して自分テスト→「覚えた」で外していく
// 2026-10-07 下田さん「混同しやすい箇所もたのむ」→ まぎらわしい2つを左右に並べる「まぎらわしい比較」（data/confuse.json）
let ankiCh = 0, ankiOpen = null, ankiHide = true, ankiShow = {}, ankiOnlyLeft = false, ankiMode = "anki";
const AK = () => ankiMode === "conf" ? CONF : ANKI;
const ankiKey = (t, r) => (t.left ? "c|" : "") + t.theme + "|" + r.q;
const ANKI_KIND = { penalty: "⚖️", period: "⏱", number: "🔢", list: "📋", compare: "↔️", other: "📌" };
function ankiDone(t) { return t.rows.filter(r => S.anki[ankiKey(t, r)]).length; }
function ankiMark(ti, ri) { const t = AK()[ti], k = ankiKey(t, t.rows[ri]); if (S.anki[k]) delete S.anki[k]; else S.anki[k] = 1; save(); render(); }
function ankiRows(t) { return t.rows.map((r, ri) => ({ r, ri })).filter(x => !ankiOnlyLeft || !S.anki[ankiKey(t, x.r)]); }
function ankiMarkNow(ri) {
  document.querySelectorAll(".ankirow").forEach(el => { const on = +el.dataset.ri === ri; el.classList.toggle("now", on); if (on) el.scrollIntoView({ block: "center", behavior: "smooth" }); });
}
function ankiSay(ti) {
  const t = AK()[ti], list = ankiRows(t);
  if (!list.length) return;
  keepAwake(true);
  const lines = t.left ? list.flatMap(({ r }) => [["A", r.q + "。"], ["B", t.trap ? `正しくは、${r.l}。ひっかけは、${r.r}。` : `${r.ll || t.left}は、${r.l}。${r.rl || t.right}は、${r.r}。`]])
    : list.flatMap(({ r }) => [["A", r.q + "。"], ["B", r.a + "。"]]);
  TTS.speakLines([["A", t.theme + "。"], ...lines], () => ankiMarkNow(-1), li => { if (li > 0) ankiMarkNow(list[Math.floor((li - 1) / 2)].ri); });
}
function Anki() {
  const A = AK(), conf = ankiMode === "conf";
  if (!A.length) return `<div class="card">準備中です。</div>`;
  { const dd = S.done[today()] || (S.done[today()] = {}); if (!dd.anki) { dd.anki = true; setTimeout(save, 0); } }
  if (ankiOpen != null && A[ankiOpen]) return AnkiTheme(ankiOpen);
  const all = A.reduce((n, t) => n + t.rows.length, 0), done = A.reduce((n, t) => n + ankiDone(t), 0);
  const list = A.map((t, ti) => ({ t, ti })).filter(x => !ankiCh || x.t.ch === ankiCh);
  return `<div class="card">
    ${CONF.length ? `<div class="seg" style="margin-bottom:10px"><button class="${!conf ? "on" : ""}" onclick="ankiMode='anki';ankiOpen=null;render()">🧠 暗記まとめ</button><button class="${conf ? "on" : ""}" onclick="ankiMode='conf';ankiOpen=null;render()">🔀 まぎらわしい比較</button></div>` : ""}
    <h2>${conf ? "🔀 まぎらわしい比較" : "🧠 暗記まとめ"}</h2>
    <div class="small">${conf ? "本番のひっかけは「似た2つを入れ替える」形がほとんどです。まぎらわしい2つを左右に並べました。答えを隠して両方言えるか試し、言えたら「覚えた」で外します。" : "罰則・期間・数字・「〜つある」ものを、テーマごとに1か所に集めました。答えを隠して言えるか試し、言えたものは「覚えた」で外していきます。"}</div>
    <div class="row mt small"><span class="grow">覚えた</span><b class="num">${done}/${all}</b></div>
    <div class="bar mt"><i style="width:${all ? done / all * 100 : 0}%;background:var(--ok)"></i></div>
    <div class="row mt" style="gap:6px;flex-wrap:wrap">${[[0, "全部"], ...CHAPS.map(c => [c.ch, "CH" + c.ch])].map(([v, l]) => `<button class="chip" style="border:0;padding:6px 12px;font-size:13px;${ankiCh === v ? "background:var(--brand);color:#fff" : ""}" onclick="ankiCh=${v};render()">${l}</button>`).join("")}</div></div>
  <div class="card">${list.map(({ t, ti }, i) => { const d = ankiDone(t), n = t.rows.length;
    return `<button onclick="ankiOpen=${ti};ankiShow={};render();scrollTo(0,0)" style="display:block;width:100%;text-align:left;border:0;border-top:${i ? "1px solid var(--line)" : "0"};background:none;padding:11px 0;color:inherit">
      <div class="row" style="gap:8px"><span style="font-size:18px">${t.left ? "🔀" : ANKI_KIND[t.kind] || "📌"}</span><span class="grow" style="font-weight:700;font-size:15px">${esc(t.theme)}</span>
        <span class="small num" style="color:${d === n ? "var(--ok)" : "var(--sub)"}">${d === n ? "✓ " : ""}${d}/${n}</span><span class="small">›</span></div>
      <div class="small" style="margin-left:26px">CH${t.ch}${t.intro ? "・" + esc(t.intro) : ""}</div></button>`; }).join("")}</div>
  <div class="center"><button class="linkbtn" onclick="go('book')">◀ 教科書に戻る</button></div>`;
}
function AnkiTheme(ti) {
  const t = AK()[ti], list = ankiRows(t), d = ankiDone(t);
  return `<div class="card"><div class="row"><button class="linkbtn" onclick="ankiOpen=null;TTS.stop();render()">◀ テーマ一覧</button><span class="grow"></span><span class="small num">覚えた ${d}/${t.rows.length}</span></div>
    <h2 style="margin-top:6px">${t.left ? "🔀" : ANKI_KIND[t.kind] || "📌"} ${esc(t.theme)}</h2>
    ${t.intro ? `<div class="small">${esc(t.intro)}</div>` : ""}
    ${t.goro ? `<div class="mt" style="padding:8px 10px;border-radius:8px;background:var(--track);font-size:14px">💡 覚え方：${esc(t.goro)}</div>` : ""}
    <div class="seg mt"><button class="${ankiHide ? "on" : ""}" onclick="ankiHide=true;ankiShow={};render()">答えを隠す（テスト）</button><button class="${!ankiHide ? "on" : ""}" onclick="ankiHide=false;render()">全部見る</button></div>
    <div class="row mt" style="gap:8px">${TTS.ok ? `<button class="btn sec" style="flex:1" onclick="ankiSay(${ti})">🎧 通しで聞く</button>` : ""}
      <button class="btn ghost" style="flex:1" onclick="ankiOnlyLeft=!ankiOnlyLeft;render()">${ankiOnlyLeft ? "全部を表示" : "まだの分だけ"}</button></div></div>
  <div class="card">${list.map(({ r, ri }, i) => { const shown = !ankiHide || ankiShow[ri], ok = S.anki[ankiKey(t, r)];
    return `<div class="ankirow" data-ri="${ri}" style="border-top:${i ? "1px solid var(--line)" : "0"};padding:10px 4px">
      <div onclick="ankiShow[${ri}]=!ankiShow[${ri}];render()" style="cursor:pointer">
        <div style="font-weight:700;font-size:15px">${esc(r.q)}</div>
        ${t.left ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px">${[[r.ll || t.left, r.l, "var(--brandbg)", ""], [r.rl || t.right, r.r, t.trap ? "var(--ngbg, var(--warnbg))" : "var(--warnbg)", t.trap ? "text-decoration:line-through;" : ""]].map(([h, v, bg, x]) => `<div style="background:${bg};border-radius:8px;padding:6px 8px;min-width:0">
          <div class="small" style="font-weight:700">${esc(h)}</div><div style="font-size:14.5px;font-weight:700;margin-top:2px;overflow-wrap:anywhere;${shown ? x : ""}color:${shown ? "var(--ink)" : "var(--sub)"}">${shown ? esc(v) : "？"}</div></div>`).join("")}</div>
          ${!shown ? `<div class="small" style="margin-top:3px">（タップで答え）</div>` : ""}`
        : `<div style="font-size:15.5px;margin-top:3px;font-weight:700;color:${shown ? "var(--brand)" : "var(--sub)"}">${shown ? esc(r.a) : "（タップで答え）"}</div>`}
        ${shown && r.tip ? `<div class="small" style="margin-top:2px">⚠ ${esc(r.tip)}</div>` : ""}</div>
      <div class="row" style="gap:8px;margin-top:6px"><span class="small grow">${esc(r.sec)} ${esc(SECM[r.sec]?.title || "")}</span>
        <button class="spk ${ok ? "on" : ""}" onclick="ankiMark(${ti},${ri})">${ok ? "✓ 覚えた" : "覚えた"}</button></div></div>`; }).join("") || `<div class="small">このテーマは全部覚えました。「全部を表示」で見直せます。</div>`}</div>
  <div class="center"><button class="linkbtn" onclick="ankiOpen=null;TTS.stop();render()">◀ テーマ一覧に戻る</button></div>`;
}

// ---------- 起動 ----------
(async () => {
  renderTabs();
  await loadQuestions();
  pqBuild();
  if (S._toPd200) { delete S._toPd200; setPerDay(200); }
  if (S.readPlan && !S.readPlan.sync) S.readPlan = null;
  if (S.lecPos && S.lecPos.at >= addDays(today(), -7) && S.lecPos.ids?.every(hasLecAudio)) {
    const P = S.lecPos; apStart(P.ids, { ii: P.ii, si: P.si, t: P.t, label: P.label, mix: P.mix, thenToday: P.thenToday, bundle: P.ids.length > 1, autoplay: false });
  } // 今日読む所を「今日解く範囲」に合わせて組み直す // 今日の分を200問に組み直す（解いた分はそのまま）
  if (S.sess && S.sess.date === today() && S.sess.i < S.sess.ids.length && S.sess.ids.every(id => QM[id])) { sess = { ...S.sess }; view = "study"; }
  else if (S.sess) { S.sess = null; save(); }
  if (S.cur && !S.cur.done) view = "mock";
  else if (S.pastCur && !S.pastCur.done && S.pastCur.pick.some(x => x != null)) view = "past";
  dojoBackfill();
  render();
  coachLoad();
  if (S.dojoKey) dojoLoad().then(ok => { if (ok && (view === "kako" || view === "home")) render(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
<script src="https://toshi5128.github.io/ai-news/hayato-sync.js" defer></script><!-- ハヤトへ記録を渡す（合言葉がある端末だけ） -->
