<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>賃管特訓</title>
<meta name="theme-color" content="#156552">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="賃管特訓">
<style>
:root{
  --bg:#f5f6f3;--card:#fff;--ink:#1c1f1d;--sub:#5d655f;--line:#e3e6e1;--brand:#156552;--brandbg:#e3f1ec;
  --ok:#1b8a5a;--okbg:#e6f4ec;--ng:#c8372d;--ngbg:#fdecea;--warn:#a86400;--warnbg:#fff3df;--track:#eceee9;
  --a:#2a78d6;--b:#8a4fd1;--c:#d9822b;--d:#1b8a5a;--e:#c2417a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141615;--card:#1d201e;--ink:#eef1ee;--sub:#a3aca5;--line:#2e332f;--brand:#4cc3a0;--brandbg:#15302a;
  --ok:#4cc38a;--okbg:#12291e;--ng:#f07167;--ngbg:#2e1513;--warn:#f0b04a;--warnbg:#2b2210;--track:#2a2e2b;
  --a:#6aa8f0;--b:#b48ae8;--c:#f0a45c;--d:#4cc38a;--e:#ea7fae;
}}

/* 会話形式の講義（ラジオ風 2人）と図 */
.talk{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.tl{display:flex;gap:8px;align-items:flex-start}.tl.B{flex-direction:row-reverse}
.tl .who{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--brandbg)}
.tl.B .who{background:var(--warnbg)}
.tl .say{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 11px;font-size:15px;line-height:1.75;min-width:0;flex:0 1 auto;max-width:calc(100% - 40px);overflow-wrap:anywhere}
.tl.B .say{background:var(--warnbg);border-color:transparent}
.tl.now .say{outline:3px solid var(--brand);outline-offset:1px;font-weight:600}.tl.now .who{transform:scale(1.15);box-shadow:0 0 0 2px var(--brand)}
.zu{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:var(--bg)}
.zu .zt{font-size:13px;font-weight:800;color:var(--brand);margin-bottom:8px}
.zrel{display:flex;flex-direction:column;gap:8px}
.zedge{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.znode{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:12px;font-weight:700;gap:2px}
.znode .ic{font-size:30px;line-height:1.1}
.zarrow{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--sub);min-width:84px;text-align:center}
.zarrow i{display:block;width:100%;height:2px;background:var(--brand);position:relative;margin-top:3px}.zarrow i:after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:8px solid var(--brand)}
.zsteps{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.zstep{flex:1 1 90px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:12px;position:relative}
.zstep .ic{font-size:22px}.zstep b{display:block;font-size:13px}.zstep small{color:var(--sub);display:block}
.zvs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zvs>div{background:var(--card);border-radius:10px;padding:8px;font-size:13px;border:2px solid var(--ok)}.zvs>div.r{border-color:var(--ng)}
.zvs b{display:block;margin-bottom:4px}.zvs ul{margin:0;padding-left:1.1em}
.znums{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.znums div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:12px}
.znums b{display:block;font-size:20px;color:var(--brand)}
.ztbl{overflow-x:auto}.ztbl table{border-collapse:collapse;width:100%;font-size:13px}.ztbl th,.ztbl td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
.ztbl th{color:var(--sub);font-size:12px}.ztbl .mo{color:var(--ok);font-weight:900;font-size:16px}.ztbl .mx{color:var(--ng);font-weight:900;font-size:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:12px 16px 24px}
header.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 6px;max-width:640px;margin:0 auto}
header.top img{width:30px;height:30px;border-radius:8px}
header.top h1{font-size:17px;margin:0;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 8px}
.small{font-size:12.5px;color:var(--sub);line-height:1.6}
.num{font-variant-numeric:tabular-nums}
.hero{display:flex;align-items:baseline;gap:6px}
.hero b{font-size:44px;line-height:1;color:var(--brand)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:var(--brand);color:#fff;text-align:center}
.btn.sec{background:var(--brandbg);color:var(--brand)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn:disabled{opacity:.5}
.btns{display:grid;gap:8px}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px}
.area{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:8px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button.on{color:var(--brand);font-weight:700}
nav.tabs svg{width:22px;height:22px}
/* 一問一答 */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:8px}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--track);color:var(--sub)}
.qtext{font-size:17px;line-height:1.75;margin:4px 0 14px;white-space:pre-wrap}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 0;font-size:40px;font-weight:800;line-height:1}
.ox .o{color:var(--ok)}.ox .x{color:var(--ng)}
.ox button.pick{border-color:currentColor}
.res{border-radius:12px;padding:12px;margin-top:12px;line-height:1.7;font-size:15px}
.res.ok{background:var(--okbg)}.res.ng{background:var(--ngbg)}
.res b.t{font-size:17px}
.ref{font-size:12px;color:var(--sub);margin-top:6px}
.prog{height:5px;background:var(--track);border-radius:3px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--brand)}
.linkbtn{border:0;background:none;color:var(--brand);padding:6px 0;font-size:14px;text-decoration:underline}
/* 模試 */
.opts{display:grid;gap:8px}
.opts button{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:15px;line-height:1.6;display:flex;gap:10px}
.opts button .n{font-weight:800;color:var(--brand);min-width:1.2em}
.opts button.pick{border-color:var(--brand);background:var(--brandbg)}
.stmts{margin:4px 0 12px;display:grid;gap:8px}
.stmts div{font-size:15px;line-height:1.7;display:flex;gap:8px}
.stmts div>b{min-width:1.3em}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 0;font-size:12px}
.grid button.ans{background:var(--brandbg);border-color:var(--brand)}
.grid button.flag{outline:2px solid var(--warn)}
.grid button.cur{background:var(--brand);color:#fff}
.grid button.okk{background:var(--okbg);border-color:var(--ok)}
.grid button.ngg{background:var(--ngbg);border-color:var(--ng)}
.timer{font-weight:700}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.ng{background:var(--ngbg);color:var(--ng)}
details.st{border-top:1px solid var(--line);padding:8px 0}
details.st summary{cursor:pointer;font-size:14px;line-height:1.6}
.days{display:flex;align-items:flex-end;gap:3px;height:96px;margin-top:6px}
.days .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.days .col b{font-size:9.5px;font-weight:600;color:var(--sub);line-height:1.2;margin-bottom:2px;font-variant-numeric:tabular-nums}
.days .col i{display:block;width:100%;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.days .col.today b{color:var(--brand)}
.dtbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.dtbl td{padding:7px 4px;border-top:1px solid var(--line)}
.dtbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.dtbl tr.today td{font-weight:700;color:var(--brand)}
.dlab{display:flex;gap:3px;font-size:10px;color:var(--sub)}.dlab span{flex:1;text-align:center}
textarea{width:100%;min-height:90px;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px}
select,input[type=number]{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.ver{text-align:center;font-size:11px;color:var(--sub);margin-top:14px}
.center{text-align:center}
b.em{color:var(--brand);background:var(--brandbg);border-radius:4px;padding:0 2px;font-weight:800}
.spk{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--brand);font-weight:700}
.spk.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.player{display:flex;justify-content:center;gap:14px;margin-top:12px}
.player button{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px}
.player button.main{width:72px;height:72px;background:var(--brand);color:#fff;border:0;font-size:28px}
.mt{margin-top:10px}
</style>
</head>
<body>
<header class="top"><img src="icon-192.png" alt=""><h1>賃管特訓</h1><span class="small" id="hdrDays"></span></header>
<main id="app"><div class="card small">問題を読み込み中…</div></main>
<nav class="tabs" id="tabs"></nav>

<script>
"use strict";
const APP_VERSION = "2026-10-06-v4.0";
const EXAM = new Date("2026-11-15T13:00:00+09:00");
const PASS_LINE = 38; // 令和7年度の合格点。目標ライン
const AREAS = {
  A: { name: "管理業法・受託契約", short: "管理業", color: "var(--a)", mock: 14 },
  B: { name: "サブリース規制",     short: "サブリース", color: "var(--b)", mock: 7 },
  C: { name: "維持保全（建物・設備）", short: "建物", color: "var(--c)", mock: 10 },
  D: { name: "賃貸借（民法・借地借家）", short: "賃貸借", color: "var(--d)", mock: 11 },
  E: { name: "金銭管理・実務", short: "実務", color: "var(--e)", mock: 8 },
};
const INTERVAL = [0, 1, 3, 7, 14, 30]; // 箱の番号 → 次に出すまでの日数
const LAST_WEEK = 7; // 最後の1週間は新しい問題を入れず、復習と模試に回す
const READ_END = "2026-10-25"; // 教科書1周目の締切（そのあと過去問期）
const PAST_URL = "https://www.chintaikanrishi.jp/exam/past";
const BOOK = "みんなが欲しかった！賃貸不動産経営管理士の教科書";
const BOOK_END = 455; // 最終Sectionの終わり（さくいんの手前）

// ---------- 保存 ----------
const KEY = "chinkan.v1";
let S = load();
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  s = s || {};
  s.cards = s.cards || {};   // id → {box,due,c,w,last,star}
  s.log = s.log || {};       // 日付 → {n,c}
  s.mocks = s.mocks || [];   // 模試の結果
  s.plan = s.plan || null;   // 今日の新規（その日の間は固定）
  s.read = s.read || {};     // 教科書のSection → 読んだ日
  s.readPlan = s.readPlan || null; // 今日読む所（その日の間は固定）
  s.pastCur = s.pastCur || null;   // 解いている途中の過去問（答案用紙）
  s.pastLog = s.pastLog || [];     // 過去問の採点結果
  s.lastBackup = s.lastBackup || null;
  s.newPerDay = s.newPerDay ?? 200; // 1日の新しい問題数（0＝おまかせ）。初期値は200問
  if (!s.pd200) { s.pd200 = 1; s._toPd200 = s.newPerDay !== 200; s.newPerDay = 200; }
  s.tts = Object.assign({ auto: true, rate: 1.2, think: 4, lecQuiz: true, lecMix: true }, s.tts || {});
  s.heard = s.heard || {};
  s.autoNext = s.autoNext ?? true; // 正解なら自動で次へ   // 講義を最後まで聞いた回数：Section → {n, last}
  s.lecPos = s.lecPos || null; // まとめて聞くの続き（どの一覧の、どこまで） // 読み上げの設定
  s.cur = s.cur || null;     // 受験中の模試
  s.done = s.done || {};     // 日付 → {count, mock, radio, nums}（今日の指示の✓に使う）
  s.syncKey = s.syncKey || (crypto.randomUUID ? crypto.randomUUID() : Array.from({ length: 32 }, () => "0123456789abcdef"[Math.random() * 16 | 0]).join(""));
  return s;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { alertBox("保存できませんでした。記録タブからバックアップを取ってください。"); } cloudSoon(); }
// ---------- クラウドへ自動で控え（2026-10-06 下田さん「全てやって」）。保存のたびに20秒まとめて送る ----------
const CLOUD = "https://aevqdsozxiklyjfavvhf.supabase.co/functions/v1/chinkan";
let cloudTimer = null;
function cloudSoon() { clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudPush, 20000); }
async function cloudPush() {
  try {
    const r = await fetch(CLOUD, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "save", key: S.syncKey, data: { ...S, cur: null } }) });
    if (r.ok) { S.cloudAt = new Date().toISOString(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { clearTimeout(cloudTimer); cloudPush(); } });
async function cloudRestore() {
  const k = (document.getElementById("syncIn")?.value || "").trim().toLowerCase();
  if (!/^[0-9a-f-]{20,64}$/.test(k)) { alertBox("引き継ぎコードが正しくありません。"); return; }
  try {
    const r = await fetch(CLOUD, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "load", key: k }) }).then(x => x.json());
    if (!r.data) { alertBox("そのコードの記録が見つかりません。"); return; }
    if (!confirm(`${new Date(r.updated_at).toLocaleString("ja-JP")} の記録で、このスマホの記録を置き換えますか？`)) return;
    localStorage.setItem(KEY, JSON.stringify({ ...r.data, syncKey: k })); location.reload();
  } catch (e) { alertBox("読み込めませんでした。電波の良い所でもう一度。"); }
}
function CloudCard() {
  return `<div class="card"><h2>☁️ 記録の自動バックアップ</h2>
    <div class="small">勉強の記録は、解くたびに自動でクラウドに控えています${S.cloudAt ? `（最終 ${new Date(S.cloudAt).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}）` : ""}。毎朝の「今日の指示」の通知も、この控えを見て作っています。</div>
    <div class="small mt">機種変更のときは、新しいスマホでこの<b>引き継ぎコード</b>を入れると続きから使えます。</div>
    <div class="mt" style="font-family:monospace;font-size:12px;word-break:break-all;background:var(--bg);padding:8px;border-radius:8px">${esc(S.syncKey)}</div>
    <details class="mt"><summary class="small">別のスマホの記録を引き継ぐ</summary><input id="syncIn" placeholder="引き継ぎコード" style="width:100%;padding:10px;margin-top:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)"><button class="btn sec mt" onclick="cloudRestore()">この記録で続きから</button></details></div>`;
}

// ---------- 日付 ----------
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const daysLeft = () => Math.max(0, Math.ceil((new Date(ymd(EXAM) + "T00:00:00") - new Date(today() + "T00:00:00")) / 86400000));

// ---------- 問題 ----------
let Q = [], QM = {}, SECS = [], SECM = {}, CHAPS = [], PAST = null, NUMS = [], LEC = {}, AUD = {}, TALK = {};
const LEC_FILES = ["lec_1a", "lec_1b", "lec_2", "lec_3", "lec_4", "lec_5"];
// 2026-10-05 下田さん「会話形式で・図やイラストでイメージしやすく」→ 講義をラジオ風の2人の会話＋図に（data/talk_*.json）。無いSectionは今までの講義のまま
const TALK_FILES = ["talk_1a", "talk_1b", "talk_2", "talk_3", "talk_4", "talk_5"];
const DATA_FILES = ["A", "B", "C", "D", "E", "X1", "X2", "X3", "X4", ...Array.from({ length: 11 }, (_, i) => "Y" + String(i + 1).padStart(2, "0"))];
async function loadQuestions() {
  const get = f => fetch(f, { cache: "no-store" }).then(r => r.ok ? r.json() : []).catch(() => []);
  const [chaps, past, nums, ...parts] = await Promise.all([get("sections.json"), get("data/past.json"), get("data/numbers.json"), ...DATA_FILES.map(f => get(`data/${f}.json`))]);
  PAST = past && past.years ? past : null;
  const lecs = await Promise.all(LEC_FILES.map(f => fetch(`data/${f}.json`, { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({}))));
  LEC = Object.assign({}, ...lecs);
  const talks = await Promise.all(TALK_FILES.map(f => fetch(`data/${f}.json`, { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({}))));
  TALK = Object.assign({}, ...talks);
  NUMS = Array.isArray(nums) ? nums : [];
  AUD = await fetch("audio/index.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  CHAPS = chaps;
  SECS = chaps.flatMap(c => c.secs.map(([id, title, page]) => ({ id, title, page, ch: c.ch })));
  SECS.forEach((x, i) => { x.pages = (SECS[i + 1]?.page || BOOK_END) - x.page; x.order = i; });
  SECM = Object.fromEntries(SECS.map(x => [x.id, x]));
  Q = parts.flat().filter(q => q && q.id && typeof q.a === "boolean");
  QM = Object.fromEntries(Q.map(q => [q.id, q]));
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const emph = s => esc(s).replace(/《(.+?)》/g, '<b class="em">$1</b>').replace(/[《》]/g, "");
const plain = s => String(s ?? "").replace(/[《》]/g, "");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const card = id => S.cards[id];

// 今日の分：期限が来た復習＋新しい問題（残り日数から逆算）
function autoQuota() {
  const unseen = Q.filter(q => !card(q.id)).length;
  // 教科書期は10/25までに一周（教科書と同じペース）、そのあとは試験1週間前まで
  const toRead = Math.round((new Date(READ_END + "T00:00:00") - new Date(today() + "T00:00:00")) / 86400000) + 1;
  const d = Math.max(1, toRead >= 1 ? toRead : daysLeft() - LAST_WEEK);
  return daysLeft() <= LAST_WEEK ? 0 : Math.min(unseen, Math.max(15, Math.ceil(unseen / d)));
}
function newQuota() {
  const unseen = Q.filter(q => !card(q.id)).length;
  return S.newPerDay ? Math.min(unseen, S.newPerDay) : autoQuota();
}
function setPerDay(n) {
  S.newPerDay = n;
  // 今日すでに解いた新しい問題は残し、残りを選び直す
  if (S.plan && S.plan.date === today()) {
    const done = S.plan.newIds.filter(id => card(id));
    S.plan = null; todayPlan(); // 未挑戦から選び直し（解いた分は含まれない）
    S.plan.newIds = [...done, ...S.plan.newIds.slice(0, Math.max(0, newQuota() - done.length))];
  }
  save(); render();
}
// おかわり：今日の分が終わったら、次の新しい問題を追加
function moreToday(n = 50) {
  todayPlan();
  const have = new Set(S.plan.newIds);
  const rank = q => (S.read[q.sec] ? 0 : 1000) + (SECM[q.sec]?.order ?? 999);
  const add = Q.filter(q => !card(q.id) && !have.has(q.id)).sort((a, b) => rank(a) - rank(b)).slice(0, n).map(q => q.id);
  if (!add.length) { alertBox("新しい問題はもうありません。全問に挑戦済みです！ 間違えた問題や苦手Sectionを繰り返しましょう。"); return; }
  S.plan.newIds.push(...add); save();
  startSession(add, `おかわり${add.length}問`);
}
const PerDaySeg = () => `<div class="seg">${[[0, `おまかせ（約${autoQuota()}問）`], [50, "50問"], [100, "100問"], [200, "200問"]].map(([n, l]) => `<button class="${S.newPerDay === n ? "on" : ""}" onclick="setPerDay(${n})">${l}</button>`).join("")}</div>`;
function todayPlan() {
  const t = today();
  if (!S.plan || S.plan.date !== t) {
    const quota = newQuota();
    // 教科書で読み終えたSectionの問題から、次に教科書の順（今日読む所が続く）
    const rank = q => (S.read[q.sec] ? 0 : 1000) + (SECM[q.sec]?.order ?? 999);
    const ids = Q.filter(q => !card(q.id)).sort((a, b) => rank(a) - rank(b)).slice(0, quota).map(q => q.id);
    S.plan = { date: t, newIds: ids };
    save();
  }
  const newLeft = S.plan.newIds.filter(id => QM[id] && !card(id));
  const due = Q.filter(q => { const c = card(q.id); return c && c.due <= t; }).sort((a, b) => card(a.id).due.localeCompare(card(b.id).due)).map(q => q.id);
  return { newLeft, due, newTotal: S.plan.newIds.length, newDone: S.plan.newIds.length - newLeft.length };
}

function record(id, ok) {
  const t = today();
  const c = S.cards[id] || { box: 0, c: 0, w: 0 };
  if (ok) { c.box = Math.min(5, Math.max(c.box, 1) + 1); c.c++; }
  else { c.box = 1; c.w++; }
  c.due = addDays(t, INTERVAL[c.box]);
  c.last = t; c.lastOk = ok;
  S.cards[id] = c;
  const L = S.log[t] || { n: 0, c: 0 }; L.n++; if (ok) L.c++; S.log[t] = L;
  save();
}

// 分野ごとの成績
function areaStats(a) {
  const qs = Q.filter(q => q.area === a);
  let seen = 0, mastered = 0, c = 0, w = 0;
  for (const q of qs) { const k = card(q.id); if (!k) continue; seen++; if (k.box >= 3) mastered++; c += k.c; w += k.w; }
  return { total: qs.length, seen, mastered, acc: c + w ? c / (c + w) : null };
}

// ---------- 読み上げ ----------
const TTS = {
  ok: typeof speechSynthesis !== "undefined",
  voice: null, token: 0,
  pickVoice() {
    if (!this.ok) return;
    const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
    // 聞き取りやすい順（iPhone=Kyoko/O-ren、Android=Google、Windows=Nanami/Haruka）
    const pref = ["O-ren", "Kyoko", "Google", "Nanami", "Otoya", "Haruka", "Hattori"];
    this.voice = pref.map(n => vs.find(v => v.name.includes(n))).find(Boolean) || vs[0] || null;
    // 会話の相方用に、別の日本語の声があれば使う（無ければ同じ声で高さだけ変える）
    this.voice2 = ["Kyoko", "O-ren", "Nanami", "Haruka", "Google"].map(n => vs.find(v => v.name.includes(n) && v !== this.voice)).find(Boolean) || vs.find(v => v !== this.voice) || this.voice;
  },
  // 記号や略記を、耳で分かる言い方に
  clean(t) {
    return String(t || "").replace(/[《》]/g, "")
      .replace(/○/g, "マル").replace(/×/g, "バツ")
      .replace(/(\d+)\s*\/\s*(\d+)/g, "$2分の$1")
      .replace(/㎡|m²|m2(?![0-9])/g, "平方メートル").replace(/％|%/g, "パーセント")
      .replace(/〜|～/g, "から").replace(/p\.(\d+)/g, "$1ページ")
      .replace(/[（(]/g, "、").replace(/[）)]/g, "、").replace(/[「」『』【】]/g, "")
      .replace(/→/g, "、つまり、").replace(/・/g, "、");
  },
  // 長文は途中で切れる端末があるので、文ごとに区切って順番に読む
  speak(text, onend) {
    if (!this.ok) { onend && onend(); return; }
    this.stop();
    if (!this.voice) this.pickVoice();
    const my = ++this.token;
    const parts = (this.clean(text).match(/[^。！？!?]+[。！？!?]*/g) || []).map(x => x.trim()).filter(Boolean);
    const next = i => {
      if (my !== this.token) return;
      if (i >= parts.length) { onend && onend(); return; }
      const u = new SpeechSynthesisUtterance(parts[i]);
      u.lang = "ja-JP"; u.rate = S.tts.rate; if (this.voice) u.voice = this.voice;
      u.onend = () => next(i + 1);
      u.onerror = e => { if (e.error !== "interrupted" && e.error !== "canceled") next(i + 1); };
      speechSynthesis.speak(u);
    };
    next(0);
  },
  // 会話の講義：進行役(A)は低め、相方(B)は高め＋別の声で、1行ずつ順に読む
  speakLines(lines, onend, onLine) {
    if (!this.ok) { onend && onend(); return; }
    this.stop();
    if (!this.voice) this.pickVoice();
    const my = ++this.token;
    const parts = lines.flatMap(([w, t], li) => (this.clean(t).match(/[^。！？!?]+[。！？!?]*/g) || []).map(x => [w, x.trim(), li]).filter(x => x[1]));
    const next = i => {
      if (my !== this.token) return;
      if (i >= parts.length) { onend && onend(); return; }
      const [w, t, li] = parts[i], u = new SpeechSynthesisUtterance(t);
      if (onLine && (i === 0 || parts[i - 1][2] !== li)) onLine(li);
      u.lang = "ja-JP"; u.rate = S.tts.rate; u.pitch = w === "B" ? 1.35 : 0.85;
      const v = w === "B" ? this.voice2 : this.voice; if (v) u.voice = v;
      u.onend = () => next(i + 1);
      u.onerror = e => { if (e.error !== "interrupted" && e.error !== "canceled") next(i + 1); };
      speechSynthesis.speak(u);
    };
    next(0);
  },
  stop() { this.token++; if (this.ok) speechSynthesis.cancel(); },
};
if (TTS.ok) { TTS.pickVoice(); speechSynthesis.onvoiceschanged = () => TTS.pickVoice(); }
const qSpeech = q => q.q;

let LS = null, wakeLock = null, thinkTimer = null;
function startListen(ids, label) {
  if (!TTS.ok) { alertBox("このスマホ（ブラウザ）は読み上げに対応していません。"); return; }
  if (!ids.length) { alertBox("該当する問題がありません。"); return; }
  if (AP.el && !AP.el.paused) AP.el.pause();
  LS = { ids, i: 0, label, phase: "q", playing: true };
  view = "listen"; render(); window.scrollTo(0, 0);
  keepAwake(true); playStep();
}
function playStep() {
  clearTimeout(thinkTimer);
  if (!LS || !LS.playing) return;
  if (LS.i >= LS.ids.length) { LS.playing = false; keepAwake(false); TTS.speak("おつかれさまでした。聞き流しを終わります。"); render(); return; }
  const q = QM[LS.ids[LS.i]];
  render();
  if (LS.phase === "q") {
    TTS.speak(`第${LS.i + 1}問。${qSpeech(q)}`, () => { if (!LS?.playing) return; thinkTimer = setTimeout(() => { if (!LS?.playing) return; LS.phase = "a"; playStep(); }, S.tts.think * 1000); });
  } else {
    TTS.speak(aSpeech(q, null), () => { if (!LS?.playing) return; thinkTimer = setTimeout(() => { if (!LS?.playing) return; LS.i++; LS.phase = "q"; playStep(); }, 1200); });
  }
}
function listenToggle() { if (!LS) return; LS.playing = !LS.playing; if (LS.playing) { keepAwake(true); playStep(); } else { clearTimeout(thinkTimer); TTS.stop(); render(); } }
function listenMove(d) { if (!LS) return; clearTimeout(thinkTimer); TTS.stop(); LS.i = Math.max(0, Math.min(LS.ids.length - 1, LS.i + d)); LS.phase = "q"; LS.playing = true; keepAwake(true); playStep(); }
function listenReveal() { if (!LS) return; clearTimeout(thinkTimer); TTS.stop(); LS.phase = "a"; LS.playing = true; playStep(); }
function stopListen() { clearTimeout(thinkTimer); TTS.stop(); keepAwake(false); LS = null; }
function setThink(t) { S.tts.think = t; save(); render(); }
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener?.("release", () => { wakeLock = null; }); }
    if (!on && wakeLock && !ALWAYS_AWAKE) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}

function ListenCard() {
  if (!TTS.ok) return "";
  const p = todayPlan();
  const wrongIds = Q.filter(q => { const c = card(q.id); return c && c.w > 0 && c.box <= 2; }).map(q => q.id);
  const readIds = Q.filter(q => S.read[q.sec]).map(q => q.id);

// ---------- 予想得点（○×の正解率 → 本番の4択の点数） ----------
// 4択は4つの文をほぼ全部判断できないと取れない。個数・組合せ問題（約3割）は4つ全部。わからない問題も4分の1は当たる
// 「今の正解率のまま全範囲をやったら何点か」を出す。まだ解いていない分野は、全体の正解率で埋める（当てずっぽう扱いにしない）
// 解いた数が少ない分野は、全体の正解率に寄せてブレを抑える（10問ぶんの重み）
function predict() {
  const pAt = x => { const k = 0.72 * x ** 3 + 0.28 * x ** 4; return k + (1 - k) * 0.25; };
  const st = {}; let seenAll = 0, accSum = 0;
  for (const a of Object.keys(AREAS)) { st[a] = areaStats(a); seenAll += st[a].seen; if (st[a].acc != null) accSum += st[a].acc * st[a].seen; }
  const overall = seenAll ? accSum / seenAll : 0.5;
  let total = 0, raw = 0; const by = {};
  for (const [a, A] of Object.entries(AREAS)) {
    const s = st[a], cov = s.total ? s.seen / s.total : 0, acc = s.acc ?? overall;
    const pNow = (s.seen * acc + 10 * overall) / (s.seen + 10);
    const pts = A.mock * pAt(pNow), best = A.mock * pAt(Math.max(pNow, 0.95));
    raw += A.mock * pAt(cov * acc + (1 - cov) * 0.5);
    by[a] = { pts, gain: best - pts, acc: s.acc, cov }; total += pts;
  }
  return { total, raw, by, seenAll, overall };
}
function PredictCard() {
  const P = predict();
  if (P.seenAll < 100) return `<div class="card"><h2>予想得点</h2><div class="small">100問ほど解くと、今の実力なら本番で何点取れそうかを出します（今 ${P.seenAll}問）。</div></div>`;
  const score = Math.round(P.total), ok = score >= PASS_LINE;
  // まだ手を付けていない分野は計画どおり後で回るので、半分以上解いた分野の中から「苦手」を勧める
  const top = Object.entries(P.by).filter(([, b]) => b.cov >= 0.5 && b.acc != null && b.acc < 0.95).sort((x, y) => y[1].gain - x[1].gain).slice(0, 2).filter(([, b]) => b.gain >= 0.5);
  return `<div class="card"><h2>予想得点（今の正解率のままなら）</h2>
    <div class="row" style="align-items:baseline;gap:6px"><b class="num" style="font-size:40px;color:${ok ? "var(--ok)" : "var(--ng)"}">${score}</b><span>点</span><span class="grow"></span><span class="small">合格ライン ${PASS_LINE}点（${ok ? "到達" : `あと${PASS_LINE - score}点`}）</span></div>
    <div class="bar mt" style="height:10px;position:relative"><i style="width:${Math.min(100, score * 2)}%;background:${ok ? "var(--ok)" : "var(--ng)"}"></i></div>
    <div class="small mt">今までの○×の正解率（${Math.round(P.overall * 100)}%）のまま全範囲を仕上げた場合の、本番4択（個数問題を含む）での目安です。○×で9割を超えると、合格ラインに届きやすくなります。${P.seenAll < Q.length ? `<br>まだ解いていない問題（${Q.length - P.seenAll}問）も同じ正解率で数えています。今日いきなり本番を受けたら（未着手を当てずっぽうにすると）約${Math.round(P.raw)}点です。` : ""}</div>
    <div class="mt" style="font-weight:700;font-size:14px">🎯 作戦表（目標 ${PASS_LINE + 2}点＝合格点＋2点の安全圏）</div>
    <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:4px">
      <tr style="color:var(--sub)"><td>分野</td><td class="num">本番</td><td class="num">今の予想</td><td class="num">目標</td><td class="num">あと</td></tr>
      ${Object.entries(AREAS).map(([a, A]) => { const goal = Math.ceil(A.mock * (PASS_LINE + 2) / 50), now = P.by[a].pts, gap = goal - now;
        return `<tr style="border-top:1px solid var(--line)"><td><span class="dot" style="background:${A.color}"></span>${A.short}</td><td class="num">${A.mock}問</td><td class="num">${now.toFixed(1)}</td><td class="num">${goal}</td><td class="num" style="color:${gap > 0.5 ? "var(--ng)" : "var(--ok)"};font-weight:700">${gap > 0.5 ? "+" + gap.toFixed(1) : "✓"}</td></tr>`; }).join("")}
    </table>
    ${top.length ? `<div class="mt" style="font-weight:700;font-size:14px">点を伸ばしやすい分野</div>${top.map(([a, b]) => `<div class="row" style="border-top:1px solid var(--line);padding:8px 0;gap:8px"><span class="dot" style="background:${AREAS[a].color}"></span>
      <div class="grow" style="font-size:14px">${AREAS[a].name}<div class="small">正答率 ${b.acc == null ? "—" : Math.round(b.acc * 100) + "%"}・挑戦 ${Math.round(b.cov * 100)}%・伸びしろ 約+${b.gain.toFixed(1)}点</div></div>
      <button class="btn sec" style="width:auto;padding:7px 12px;font-size:13px" onclick="startArea('${a}','weak')">苦手を解く</button></div>`).join("")}` : `<div class="small mt">分野ごとに半分以上解き進めると、点を伸ばしやすい分野をここに出します。</div>`}</div>`;
}

// 1Sectionの目安の分数（日本語の読み上げは1倍速でおよそ1分360字）。問題5問は1問約35秒
function lecMin(id, mix) {
  const L = LEC[id]; if (!L) return 0;
  if (AUD[id]?.lec) return (AUD[id].lec + (mix ? AUD[id].q || 0 : 0)) / 60 / S.tts.rate;
  const ch = L.intro.length + L.summary.length + L.points.reduce((s2, p) => s2 + p.h.length + p.t.length, 0);
  return ch / (360 * S.tts.rate) + (mix && secQs(id).length ? 5 * (35 + S.tts.think) / 60 : 0);
}
const fmtMin = m => m >= 60 ? `約${Math.floor(m / 60)}時間${Math.round(m % 60) ? Math.round(m % 60) + "分" : ""}` : `約${Math.max(1, Math.round(m))}分`;
function bundleIds(kind) {

  if (kind === "unread") return all.filter(id => !S.read[id]);

}

const secQs = id => Q.filter(q => q.sec === id);
function readEnd() {
  if (!S.newPerDay) return READ_END;
  const unseen = Q.filter(q => !card(q.id)).length;
  if (!unseen) return addDays(today(), -1);
  const end = addDays(today(), Math.ceil(unseen / S.newPerDay) - 1);
  return end < READ_END ? end : READ_END;
}
const mdj = d => `${+d.slice(5, 7)}/${+d.slice(8)}`;
function readPlan() {
  const t = today();
  if (!S.readPlan || S.readPlan.date !== t) {
    // まず「今日解く新しい問題が出るSection」のうち、まだ読んでいない所＝今日読む所（読む・聞く・解くを同じ範囲に）
    todayPlan();
    const sync = [...new Set(S.plan.newIds.map(id => QM[id]?.sec).filter(Boolean))]
      .filter(id => !S.read[id] && SECM[id]).sort((a, b) => SECM[a].order - SECM[b].order);
    if (sync.length) { S.readPlan = { date: t, ids: sync, sync: true }; save(); return S.readPlan; }
    const RE = readEnd();
    const left = SECS.filter(x => !S.read[x.id]);
    const days = Math.max(1, Math.round((new Date(RE + "T00:00:00") - new Date(t + "T00:00:00")) / 86400000) + 1);
    const leftPages = left.reduce((s, x) => s + x.pages, 0);
    const target = t > RE ? Infinity : Math.ceil(leftPages / days);
    const ids = []; let pg = 0;
    // 1日分のページ数に届くまでSectionを順に。半分以上はみ出すSectionは翌日へ
    for (const x of left) { if (ids.length && (t > RE || pg + x.pages / 2 > target)) break; ids.push(x.id); pg += x.pages; }
    S.readPlan = { date: t, ids, target: isFinite(target) ? target : 0 };
    save();
  }
  return S.readPlan;
}

// ---------- 模試（○×の文を4つ組み合わせて本番形式の4択を作る） ----------
const KANA = ["ア", "イ", "ウ", "エ"];
function pickStmts(pool, nTrue, nFalse) {
  // 同じ小分類から集められればそれを優先（本番も1問1テーマ）
  const subs = shuffle([...new Set(pool.map(q => q.sub))]);
  for (const s of subs) {
    const p = pool.filter(q => q.sub === s), T = shuffle(p.filter(q => q.a)), F = shuffle(p.filter(q => !q.a));
    if (T.length >= nTrue && F.length >= nFalse) return shuffle([...T.slice(0, nTrue), ...F.slice(0, nFalse)]);
  }
  const T = shuffle(pool.filter(q => q.a)), F = shuffle(pool.filter(q => !q.a));
  if (T.length >= nTrue && F.length >= nFalse) return shuffle([...T.slice(0, nTrue), ...F.slice(0, nFalse)]);
  return null;
}
function makeItem(area, type, used, base) {
  const pool = (base || Q.filter(q => q.area === area)).filter(q => !used.has(q.id));
  let st, ans, opts;
  if (type === "right") { st = pickStmts(pool, 1, 3); if (!st) return null; ans = st.findIndex(q => q.a); }
  else if (type === "wrong") { st = pickStmts(pool, 3, 1); if (!st) return null; ans = st.findIndex(q => !q.a); }
  else if (type === "count") {
    const k = 1 + Math.floor(Math.random() * 4); st = pickStmts(pool, k, 4 - k); if (!st) return null;
    ans = k - 1; opts = ["1つ", "2つ", "3つ", "4つ"];
  } else { // 組合せ：正しいもの2つ
    st = pickStmts(pool, 2, 2); if (!st) return null;
    const pairs = [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]];
    const good = pairs.find(([x, y]) => st[x].a && st[y].a);
    const others = shuffle(pairs.filter(p => p !== good)).slice(0, 3);
    const four = [good, ...others].sort((p, q) => p[0] - q[0] || p[1] - q[1]);
    ans = four.indexOf(good); opts = four.map(([x, y]) => `${KANA[x]}、${KANA[y]}`);
  }
  st.forEach(q => used.add(q.id));
  return { area: area || st[0].area, type, ids: st.map(q => q.id), ans, opts: opts || null };
}
const STEM = {
  right: "次の記述のうち、正しいものはどれか。",
  wrong: "次の記述のうち、誤っているものはどれか。",
  count: "次の記述ア〜エのうち、正しいものはいくつあるか。",
  combo: "次の記述ア〜エのうち、正しいものの組合せはどれか。",
};
const MINI = { A: 3, B: 1, C: 2, D: 2, E: 2 }; // ミニ模試10問の分野配分（本番の比率を縮めたもの）
function buildMock(size = 50) {
  const used = new Set(), items = [];
  for (const [a, A] of Object.entries(AREAS)) {
    const n = size >= 50 ? A.mock : MINI[a];
    // 本番の比率に近づける：個数・組合せを各分野に少し混ぜる
    const types = [];
    for (let i = 0; i < n; i++) types.push(i % 6 === 2 ? "count" : i % 9 === 5 ? "combo" : i % 2 ? "wrong" : "right");
    for (const t of shuffle(types)) { const it = makeItem(a, t, used) || makeItem(a, "right", used) || makeItem(a, "wrong", used); if (it) items.push(it); }
  }
  return size >= 50 ? items : shuffle(items);
}
function startMock(size = 50) {
  const items = buildMock(size);
  if (items.length < Math.min(size, 10)) { alertBox("問題がまだ少ないため模試を作れません。"); return; }
  S.cur = { items, pick: items.map(() => null), flag: items.map(() => false), i: 0, start: Date.now(), done: false, limit: size >= 50 ? 7200 : 1200 };
  save(); render(); window.scrollTo(0, 0);
}
let timerId = null;

}
function startTimer() { if (!timerId) timerId = setInterval(tick, 1000); setTimeout(tick, 0); }

// 問題を移るたびに、それまで見ていた問題の時間を足す（本番リハーサルで「時間を使いすぎた所」を出すため）
function mockClock(m) { const now = Date.now(); m.spent = m.spent || m.items.map(() => 0); m.spent[m.i] += now - (m.qt || m.start); m.qt = now; }

  if (S.cur && !S.cur.done) view = "mock";
  else if (S.pastCur && !S.pastCur.done && S.pastCur.pick.some(x => x != null)) view = "past";
  render();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
