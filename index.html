<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>賃管特訓</title>
<meta name="theme-color" content="#156552">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="賃管特訓">
<style>
:root{
  --bg:#f5f6f3;--card:#fff;--ink:#1c1f1d;--sub:#5d655f;--line:#e3e6e1;--brand:#156552;--brandbg:#e3f1ec;
  --ok:#1b8a5a;--okbg:#e6f4ec;--ng:#c8372d;--ngbg:#fdecea;--warn:#a86400;--warnbg:#fff3df;--track:#eceee9;
  --a:#2a78d6;--b:#8a4fd1;--c:#d9822b;--d:#1b8a5a;--e:#c2417a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141615;--card:#1d201e;--ink:#eef1ee;--sub:#a3aca5;--line:#2e332f;--brand:#4cc3a0;--brandbg:#15302a;
  --ok:#4cc38a;--okbg:#12291e;--ng:#f07167;--ngbg:#2e1513;--warn:#f0b04a;--warnbg:#2b2210;--track:#2a2e2b;
  --a:#6aa8f0;--b:#b48ae8;--c:#f0a45c;--d:#4cc38a;--e:#ea7fae;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:12px 16px 24px}
header.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 6px;max-width:640px;margin:0 auto}
header.top img{width:30px;height:30px;border-radius:8px}
header.top h1{font-size:17px;margin:0;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 8px}
.small{font-size:12.5px;color:var(--sub);line-height:1.6}
.num{font-variant-numeric:tabular-nums}
.hero{display:flex;align-items:baseline;gap:6px}
.hero b{font-size:44px;line-height:1;color:var(--brand)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:var(--brand);color:#fff;text-align:center}
.btn.sec{background:var(--brandbg);color:var(--brand)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn:disabled{opacity:.5}
.btns{display:grid;gap:8px}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px}
.area{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:8px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button.on{color:var(--brand);font-weight:700}
nav.tabs svg{width:22px;height:22px}
/* 一問一答 */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:8px}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--track);color:var(--sub)}
.qtext{font-size:17px;line-height:1.75;margin:4px 0 14px;white-space:pre-wrap}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 0;font-size:40px;font-weight:800;line-height:1}
.ox .o{color:var(--ok)}.ox .x{color:var(--ng)}
.ox button.pick{border-color:currentColor}
.res{border-radius:12px;padding:12px;margin-top:12px;line-height:1.7;font-size:15px}
.res.ok{background:var(--okbg)}.res.ng{background:var(--ngbg)}
.res b.t{font-size:17px}
.ref{font-size:12px;color:var(--sub);margin-top:6px}
.prog{height:5px;background:var(--track);border-radius:3px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--brand)}
.linkbtn{border:0;background:none;color:var(--brand);padding:6px 0;font-size:14px;text-decoration:underline}
/* 模試 */
.opts{display:grid;gap:8px}
.opts button{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:15px;line-height:1.6;display:flex;gap:10px}
.opts button .n{font-weight:800;color:var(--brand);min-width:1.2em}
.opts button.pick{border-color:var(--brand);background:var(--brandbg)}
.stmts{margin:4px 0 12px;display:grid;gap:8px}
.stmts div{font-size:15px;line-height:1.7;display:flex;gap:8px}
.stmts div>b{min-width:1.3em}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 0;font-size:12px}
.grid button.ans{background:var(--brandbg);border-color:var(--brand)}
.grid button.flag{outline:2px solid var(--warn)}
.grid button.cur{background:var(--brand);color:#fff}
.grid button.okk{background:var(--okbg);border-color:var(--ok)}
.grid button.ngg{background:var(--ngbg);border-color:var(--ng)}
.timer{font-weight:700}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.ng{background:var(--ngbg);color:var(--ng)}
details.st{border-top:1px solid var(--line);padding:8px 0}
details.st summary{cursor:pointer;font-size:14px;line-height:1.6}
.days{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:6px}
.days div{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.dlab{display:flex;gap:3px;font-size:10px;color:var(--sub)}.dlab span{flex:1;text-align:center}
textarea{width:100%;min-height:90px;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px}
select,input[type=number]{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.ver{text-align:center;font-size:11px;color:var(--sub);margin-top:14px}
.center{text-align:center}
.spk{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--brand);font-weight:700}
.spk.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.player{display:flex;justify-content:center;gap:14px;margin-top:12px}
.player button{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px}
.player button.main{width:72px;height:72px;background:var(--brand);color:#fff;border:0;font-size:28px}
.mt{margin-top:10px}
</style>
</head>
<body>
<header class="top"><img src="icon-192.png" alt=""><h1>賃管特訓</h1><span class="small" id="hdrDays"></span></header>
<main id="app"><div class="card small">問題を読み込み中…</div></main>
<nav class="tabs" id="tabs"></nav>

<script>
"use strict";
const APP_VERSION = "2026-10-01-v1.3-voice";
const EXAM = new Date("2026-11-15T13:00:00+09:00");
const PASS_LINE = 38; // 令和7年度の合格点。目標ライン
const AREAS = {
  A: { name: "管理業法・受託契約", short: "管理業", color: "var(--a)", mock: 14 },
  B: { name: "サブリース規制",     short: "サブリース", color: "var(--b)", mock: 7 },
  C: { name: "維持保全（建物・設備）", short: "建物", color: "var(--c)", mock: 10 },
  D: { name: "賃貸借（民法・借地借家）", short: "賃貸借", color: "var(--d)", mock: 11 },
  E: { name: "金銭管理・実務", short: "実務", color: "var(--e)", mock: 8 },
};
const INTERVAL = [0, 1, 3, 7, 14, 30]; // 箱の番号 → 次に出すまでの日数
const LAST_WEEK = 7; // 最後の1週間は新しい問題を入れず、復習と模試に回す
const READ_END = "2026-10-25"; // 教科書1周目の締切（そのあと過去問期）
const PAST_URL = "https://www.chintaikanrishi.jp/exam/past";
const BOOK = "みんなが欲しかった！賃貸不動産経営管理士の教科書";
const BOOK_END = 455; // 最終Sectionの終わり（さくいんの手前）

// ---------- 保存 ----------
const KEY = "chinkan.v1";
let S = load();
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  s = s || {};
  s.cards = s.cards || {};   // id → {box,due,c,w,last,star}
  s.log = s.log || {};       // 日付 → {n,c}
  s.mocks = s.mocks || [];   // 模試の結果
  s.plan = s.plan || null;   // 今日の新規（その日の間は固定）
  s.read = s.read || {};     // 教科書のSection → 読んだ日
  s.readPlan = s.readPlan || null; // 今日読む所（その日の間は固定）
  s.pastCur = s.pastCur || null;   // 解いている途中の過去問（答案用紙）
  s.pastLog = s.pastLog || [];     // 過去問の採点結果
  s.lastBackup = s.lastBackup || null;
  s.tts = Object.assign({ auto: true, rate: 1.2, think: 4 }, s.tts || {}); // 読み上げの設定
  s.cur = s.cur || null;     // 受験中の模試
  return s;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { alertBox("保存できませんでした。記録タブからバックアップを取ってください。"); } }

// ---------- 日付 ----------
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const daysLeft = () => Math.max(0, Math.ceil((new Date(ymd(EXAM) + "T00:00:00") - new Date(today() + "T00:00:00")) / 86400000));

// ---------- 問題 ----------
let Q = [], QM = {}, SECS = [], SECM = {}, CHAPS = [], PAST = null, NUMS = [];
const DATA_FILES = ["A", "B", "C", "D", "E", "X1", "X2", "X3", "X4"];
async function loadQuestions() {
  const get = f => fetch(f, { cache: "no-store" }).then(r => r.ok ? r.json() : []).catch(() => []);
  const [chaps, past, nums, ...parts] = await Promise.all([get("sections.json"), get("data/past.json"), get("data/numbers.json"), ...DATA_FILES.map(f => get(`data/${f}.json`))]);
  PAST = past && past.years ? past : null;
  NUMS = Array.isArray(nums) ? nums : [];
  CHAPS = chaps;
  SECS = chaps.flatMap(c => c.secs.map(([id, title, page]) => ({ id, title, page, ch: c.ch })));
  SECS.forEach((x, i) => { x.pages = (SECS[i + 1]?.page || BOOK_END) - x.page; x.order = i; });
  SECM = Object.fromEntries(SECS.map(x => [x.id, x]));
  Q = parts.flat().filter(q => q && q.id && typeof q.a === "boolean");
  QM = Object.fromEntries(Q.map(q => [q.id, q]));
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const card = id => S.cards[id];

// 今日の分：期限が来た復習＋新しい問題（残り日数から逆算）
function newQuota() {
  const unseen = Q.filter(q => !card(q.id)).length;
  // 教科書期は10/25までに一周（教科書と同じペース）、そのあとは試験1週間前まで
  const toRead = Math.round((new Date(READ_END + "T00:00:00") - new Date(today() + "T00:00:00")) / 86400000) + 1;
  const d = Math.max(1, toRead >= 1 ? toRead : daysLeft() - LAST_WEEK);
  return daysLeft() <= LAST_WEEK ? 0 : Math.min(unseen, Math.max(15, Math.ceil(unseen / d)));
}
function todayPlan() {
  const t = today();
  if (!S.plan || S.plan.date !== t) {
    const quota = newQuota();
    // 教科書で読み終えたSectionの問題から、次に教科書の順（今日読む所が続く）
    const rank = q => (S.read[q.sec] ? 0 : 1000) + (SECM[q.sec]?.order ?? 999);
    const ids = Q.filter(q => !card(q.id)).sort((a, b) => rank(a) - rank(b)).slice(0, quota).map(q => q.id);
    S.plan = { date: t, newIds: ids };
    save();
  }
  const newLeft = S.plan.newIds.filter(id => QM[id] && !card(id));
  const due = Q.filter(q => { const c = card(q.id); return c && c.due <= t; }).sort((a, b) => card(a.id).due.localeCompare(card(b.id).due)).map(q => q.id);
  return { newLeft, due, newTotal: S.plan.newIds.length };
}

function record(id, ok) {
  const t = today();
  const c = S.cards[id] || { box: 0, c: 0, w: 0 };
  if (ok) { c.box = Math.min(5, Math.max(c.box, 1) + 1); c.c++; }
  else { c.box = 1; c.w++; }
  c.due = addDays(t, INTERVAL[c.box]);
  c.last = t;
  S.cards[id] = c;
  const L = S.log[t] || { n: 0, c: 0 }; L.n++; if (ok) L.c++; S.log[t] = L;
  save();
}

// 分野ごとの成績
function areaStats(a) {
  const qs = Q.filter(q => q.area === a);
  let seen = 0, mastered = 0, c = 0, w = 0;
  for (const q of qs) { const k = card(q.id); if (!k) continue; seen++; if (k.box >= 3) mastered++; c += k.c; w += k.w; }
  return { total: qs.length, seen, mastered, acc: c + w ? c / (c + w) : null };
}

// ---------- 画面の切り替え ----------
let view = "home", sess = null, mock = null;
const TABS = [
  ["home", "ホーム", '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>'],
  ["book", "教科書", '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 7h6"/>'],
  ["study", "一問一答", '<circle cx="8" cy="12" r="4"/><path d="M15 8l6 8M21 8l-6 8"/>'],
  ["mock", "模試", '<path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="M9 12l2 2 4-4"/>'],
  ["stats", "記録", '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
];
const PARENT = { past: "mock", numbers: "book", listen: "study" };
function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, l, d]) =>
    `<button class="${(PARENT[view] || view) === k ? "on" : ""}" onclick="go('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>${l}</button>`).join("");
  document.getElementById("hdrDays").textContent = `本番まで ${daysLeft()}日`;
}
function go(v) {
  if (v !== view) { TTS.stop(); if (view === "listen") stopListen(); }
  if (view === "study" && sess && v !== "study") sess = null;
  view = v; render(); window.scrollTo(0, 0);
}
function render() {
  renderTabs();
  const el = document.getElementById("app");
  if (!Q.length) { el.innerHTML = `<div class="card">問題データが見つかりません。電波の良いところで開き直してください。</div>`; return; }
  el.innerHTML = view === "home" ? Home() : view === "book" ? Book() : view === "numbers" ? Numbers() : view === "past" ? Past() : view === "listen" ? Listen() : view === "study" ? Study() : view === "mock" ? Mock() : Stats();
}
function alertBox(msg) { const el = document.getElementById("app"); el.insertAdjacentHTML("afterbegin", `<div class="card" style="background:var(--warnbg)">${esc(msg)}</div>`); }

// ---------- ホーム ----------
function Home() {
  const p = todayPlan(), L = S.log[today()] || { n: 0, c: 0 };
  const todo = p.due.length + p.newLeft.length;
  const seen = Object.keys(S.cards).filter(id => QM[id]).length;
  const lastMock = S.mocks.filter(m => m.n >= 40).slice(-1)[0];
  const lastPast = S.pastLog.slice(-1)[0];
  const answered = Object.values(S.log).reduce((s, l) => s + l.n, 0);
  const needBackup = answered >= 30 && (!S.lastBackup || addDays(S.lastBackup, 7) <= today());
  const dl = daysLeft();
  const phase = dl <= LAST_WEEK ? "仕上げ期：新しいことはしない。模試と、間違えた問題・★マークの総ざらいだけ。"
    : today() > READ_END ? `過去問期：<a href="${PAST_URL}" target="_blank" rel="noopener">公式の過去問</a>を時間を計って1年分ずつ。間違えた所は教科書に戻って読み直し。今日の分も続けます。`
    : "教科書期（〜10/25）：教科書を読む → 読んだSectionの問題を解く、の繰り返し。1周目は覚えなくてOK。";
  return `
  <div class="card">
    <div class="small">令和8年11月15日（日）13:00 本番まで</div>
    <div class="hero"><b class="num">${dl}</b><span>日</span></div>
    <div class="small mt">${phase}</div>
  </div>
  ${needBackup ? `<div class="card" style="background:var(--warnbg)"><b>記録のバックアップを取りましょう</b><div class="small">${S.lastBackup ? `前回 ${S.lastBackup.slice(5).replace("-", "/")}` : "まだ一度も取っていません"}。スマホの故障や機種変更で記録が消えないように、週1回保存しておくと安心です。</div>
    <div class="mt"><button class="btn sec" onclick="go('stats')">記録タブで保存する</button></div></div>` : ""}
  ${ReadToday()}
  <div class="card">
    <h2>今日の分（一問一答）</h2>
    ${todo ? `<div class="row small"><span class="grow">復習 <b class="num">${p.due.length}</b>問 ＋ 新しい問題 <b class="num">${p.newLeft.length}</b>問</span><span>今日 ${L.n}問解いた</span></div>
      <div class="mt"><button class="btn" onclick="startToday()">▶ 今日の分をはじめる（${todo}問）</button></div>`
      : `<div class="res ok"><b class="t">今日の分は完了です 🎉</b><br>今日 ${L.n}問・正答率 ${L.n ? Math.round(L.c / L.n * 100) : 0}%。余裕があれば苦手な分野をもう少し。</div>`}
  </div>
  <div class="card">
    <h2>分野ごとの仕上がり</h2>
    <div class="small">「覚えた」＝3回以上続けて正解した問題の割合。全${Q.length}問中 ${seen}問に挑戦済み。</div>
    ${Object.entries(AREAS).map(([a, A]) => { const s = areaStats(a); const pct = s.total ? Math.round(s.mastered / s.total * 100) : 0;
      return `<div class="area"><div><span class="dot" style="background:${A.color}"></span>${A.name}<span class="small">（本番約${A.mock}問）</span></div><div class="num small">${pct}%</div>
        <div class="bar" style="grid-column:1/-1"><i style="width:${pct}%;background:${A.color}"></i></div></div>`; }).join("")}
  </div>
  <div class="card">
    <h2>模試・過去問</h2>
    ${lastPast ? `<div class="row"><span class="grow">過去問 ${esc(pastYear(lastPast.year)?.label || lastPast.year)}（${lastPast.date.slice(5).replace("-", "/")}）</span><b class="num" style="font-size:22px;color:${lastPast.score >= lastPast.pass ? "var(--ok)" : "var(--ng)"}">${lastPast.score}点</b><span class="small">/50（合格点${lastPast.pass}）</span></div>` : ""}
    ${lastMock ? `<div class="row"><span class="grow">模試 ${lastMock.date.slice(5).replace("-", "/")}</span><b class="num" style="font-size:22px;color:${lastMock.score >= PASS_LINE ? "var(--ok)" : "var(--ng)"}">${lastMock.score}点</b><span class="small">/50（目標${PASS_LINE}点）</span></div>`
      : lastPast ? ""
      : `<div class="small">本番と同じ4択50問・120分。まだ受けていません。一周の半分くらいまで進んだら一度受けてみましょう。</div>`}
    <div class="mt"><button class="btn sec" onclick="go('mock')">模試・過去問へ</button></div>
  </div>`;
}

// ---------- 読み上げ ----------
const TTS = {
  ok: typeof speechSynthesis !== "undefined",
  voice: null, token: 0,
  pickVoice() {

const secQs = id => Q.filter(q => q.sec === id);
function readPlan() {
  const t = today();
  if (!S.readPlan || S.readPlan.date !== t) {
    const left = SECS.filter(x => !S.read[x.id]);
    const days = Math.max(1, Math.round((new Date(READ_END + "T00:00:00") - new Date(t + "T00:00:00")) / 86400000) + 1);
    const leftPages = left.reduce((s, x) => s + x.pages, 0);
    const target = t > READ_END ? Infinity : Math.ceil(leftPages / days);
    const ids = []; let pg = 0;
    // 1日分のページ数に届くまでSectionを順に。半分以上はみ出すSectionは翌日へ
    for (const x of left) { if (ids.length && (t > READ_END || pg + x.pages / 2 > target)) break; ids.push(x.id); pg += x.pages; }

  }

}

// ---------- 模試（○×の文を4つ組み合わせて本番形式の4択を作る） ----------
const KANA = ["ア", "イ", "ウ", "エ"];
function pickStmts(pool, nTrue, nFalse) {
  // 同じ小分類から集められればそれを優先（本番も1問1テーマ）
  const subs = shuffle([...new Set(pool.map(q => q.sub))]);
  for (const s of subs) {
    const p = pool.filter(q => q.sub === s), T = shuffle(p.filter(q => q.a)), F = shuffle(p.filter(q => !q.a));
    if (T.length >= nTrue && F.length >= nFalse) return shuffle([...T.slice(0, nTrue), ...F.slice(0, nFalse)]);
  }
  const T = shuffle(pool.filter(q => q.a)), F = shuffle(pool.filter(q => !q.a));
  if (T.length >= nTrue && F.length >= nFalse) return shuffle([...T.slice(0, nTrue), ...F.slice(0, nFalse)]);
  return null;
}
function makeItem(area, type, used) {
  const pool = Q.filter(q => q.area === area && !used.has(q.id));
  let st, ans, opts;
  if (type === "right") { st = pickStmts(pool, 1, 3); if (!st) return null; ans = st.findIndex(q => q.a); }
  else if (type === "wrong") { st = pickStmts(pool, 3, 1); if (!st) return null; ans = st.findIndex(q => !q.a); }
  else if (type === "count") {
    const k = 1 + Math.floor(Math.random() * 4); st = pickStmts(pool, k, 4 - k); if (!st) return null;
    ans = k - 1; opts = ["1つ", "2つ", "3つ", "4つ"];
  } else { // 組合せ：正しいもの2つ
    st = pickStmts(pool, 2, 2); if (!st) return null;
    const pairs = [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]];
    const good = pairs.find(([x, y]) => st[x].a && st[y].a);
    const others = shuffle(pairs.filter(p => p !== good)).slice(0, 3);
    const four = [good, ...others].sort((p, q) => p[0] - q[0] || p[1] - q[1]);
    ans = four.indexOf(good); opts = four.map(([x, y]) => `${KANA[x]}、${KANA[y]}`);
  }
  st.forEach(q => used.add(q.id));
  return { area, type, ids: st.map(q => q.id), ans, opts: opts || null };
}
const STEM = {
  right: "次の記述のうち、正しいものはどれか。",
  wrong: "次の記述のうち、誤っているものはどれか。",
  count: "次の記述ア〜エのうち、正しいものはいくつあるか。",
  combo: "次の記述ア〜エのうち、正しいものの組合せはどれか。",
};
const MINI = { A: 3, B: 1, C: 2, D: 2, E: 2 }; // ミニ模試10問の分野配分（本番の比率を縮めたもの）
function buildMock(size = 50) {
  const used = new Set(), items = [];
  for (const [a, A] of Object.entries(AREAS)) {
    const n = size >= 50 ? A.mock : MINI[a];
    // 本番の比率に近づける：個数・組合せを各分野に少し混ぜる
    const types = [];
    for (let i = 0; i < n; i++) types.push(i % 6 === 2 ? "count" : i % 9 === 5 ? "combo" : i % 2 ? "wrong" : "right");
    for (const t of shuffle(types)) { const it = makeItem(a, t, used) || makeItem(a, "right", used) || makeItem(a, "wrong", used); if (it) items.push(it); }
  }
  return size >= 50 ? items : shuffle(items);
}
function startMock(size = 50) {
  const items = buildMock(size);
  if (items.length < Math.min(size, 10)) { alertBox("問題がまだ少ないため模試を作れません。"); return; }
  S.cur = { items, pick: items.map(() => null), flag: items.map(() => false), i: 0, start: Date.now(), done: false, limit: size >= 50 ? 7200 : 1200 };
  save(); render(); window.scrollTo(0, 0);
}
let timerId = null;
// タイマーは画面の #timer（data-start / data-limit / data-kind）を見て動く

  if (left === 0 && el.dataset.kind === "mock" && S.cur && !S.cur.done) finishMock(true);

  const n = cur.pick.filter(x => x != null).length;
  return `<div class="qhead"><span>${esc(y.label)}　入力 ${n}/${y.qs.length}</span><span class="timer num" id="timer" data-start="${cur.start}" data-limit="7200" data-kind="past"></span></div>
  <div class="card"><div class="small">${y.pdf ? `<a href="${esc(y.pdf)}" target="_blank" rel="noopener">📄 問題PDFを開く</a>　` : ""}紙で解いて、選んだ番号をタップ（もう一度押すと取り消し）。時間は本番と同じ120分が目安です。</div></div>
  ${[0, 10, 20, 30, 40].map(s0 => `<div class="card" style="padding:8px 12px">${y.qs.slice(s0, s0 + 10).map((q, j) => { const i = s0 + j;
    return `<div class="row" style="padding:5px 0;gap:6px"><b class="num" style="width:44px">問${q.no}</b>
      ${[1, 2, 3, 4].map(k => `<button onclick="pickPast(${i},${k})" style="flex:1;border:1.5px solid ${cur.pick[i] === k ? "var(--brand)" : "var(--line)"};background:${cur.pick[i] === k ? "var(--brand)" : "var(--card)"};color:${cur.pick[i] === k ? "#fff" : "var(--ink)"};border-radius:9px;padding:8px 0;font-weight:700">${k}</button>`).join("")}</div>`; }).join("")}</div>`).join("")}
  <div class="btns"><button class="btn" onclick="finishPast()">採点する</button>
    <button class="linkbtn" onclick="go('mock')">あとで続ける（入力は保存されています）</button></div>`;
}
function finishPast() {
  const cur = S.pastCur, y = pastYear(cur.year);
  const blank = cur.pick.filter(x => x == null).length;
  if (blank && !confirm(`まだ${blank}問が未入力です。採点しますか？（未入力は不正解）`)) return;
  cur.done = true; cur.end = Date.now();
  const wrong = y.qs.filter((q, i) => !pastOk(q, cur.pick[i])).map(q => q.no);
  cur.score = y.qs.length - wrong.length;
  S.pastLog.push({ year: y.year, date: today(), score: cur.score, pass: y.pass, n: y.qs.length, min: Math.round((cur.end - cur.start) / 60000), wrong });
  save(); render(); window.scrollTo(0, 0);
}
function studyWrongSecs(year) {
  const log = S.pastLog.filter(l => l.year === year).slice(-1)[0], y = pastYear(year); if (!log) return;
  const secs = new Set(y.qs.filter(q => log.wrong.includes(q.no)).map(q => q.sec));
  const ids = shuffle(Q.filter(q => secs.has(q.sec))).slice(0, 40).map(q => q.id);
  startSession(ids, "過去問の復習");
}
function PastResult(cur, y) {
  const pass = cur.score >= y.pass;
  const byCh = {}; y.qs.forEach((q, i) => { const ch = SECM[q.sec]?.ch || 0; const b = byCh[ch] || (byCh[ch] = { n: 0, c: 0 }); b.n++; if (pastOk(q, cur.pick[i])) b.c++; });
  const wrongs = y.qs.map((q, i) => ({ q, i })).filter(({ q, i }) => !pastOk(q, cur.pick[i]));
  const ansTxt = a => a === "all" ? "全員正解" : Array.isArray(a) ? a.join("・") : a;
  return `
  <div class="card center"><div class="small">${esc(y.label)} 本試験</div>
    <div class="hero" style="justify-content:center"><b class="num" style="color:${pass ? "var(--ok)" : "var(--ng)"}">${cur.score}</b><span>/ ${y.qs.length}点</span></div>
    <div class="mt"><span class="tag ${pass ? "ok" : "ng"}">${pass ? `合格点（${y.pass}点）クリア` : `合格点（${y.pass}点）まであと${y.pass - cur.score}点`}</span></div>
    <div class="small mt">かかった時間 ${Math.round((cur.end - cur.start) / 60000)}分</div></div>
  <div class="card"><h2>教科書のCHAPTER別</h2>${CHAPS.map(c => { const b = byCh[c.ch]; if (!b) return "";
    return `<div class="area"><div><span class="chip">CH${c.ch}</span> ${esc(c.title)}</div><div class="num small">${b.c}/${b.n}</div>
      <div class="bar" style="grid-column:1/-1"><i style="width:${b.c / b.n * 100}%;background:var(--brand)"></i></div></div>`; }).join("")}</div>
  <div class="card"><h2>間違えた問題（${wrongs.length}問）</h2>
    <div class="small">問題PDFで解説を確認したら、教科書の該当ページを読み直しましょう。</div>
    ${wrongs.map(({ q, i }) => { const x = SECM[q.sec];
      return `<div style="border-top:1px solid var(--line);padding:8px 0"><div class="row"><b class="num" style="width:44px">問${q.no}</b><span class="grow" style="font-size:14px">${esc(q.topic)}</span>
        <span class="small">あなた ${cur.pick[i] ?? "—"}／正解 <b>${ansTxt(q.ans)}</b></span></div>
        <div class="small" style="margin-left:44px">${x ? `教科書 ${x.id} ${esc(x.title)}（p.${x.page}〜）` : ""}${q.note ? `<br>⚠ ${esc(q.note)}` : ""}</div></div>`; }).join("")}
    <div class="btns mt">${wrongs.length ? `<button class="btn" onclick="studyWrongSecs('${y.year}')">間違えたSectionの一問一答を解く</button>` : ""}
    <button class="btn ghost" onclick="S.pastCur=null;save();go('mock')">閉じる</button></div></div>`;
}

// ---------- 数字まとめ ----------
let numCh = 1, numHide = false, numOpen = {};
function sayNums() {
  const list = NUMS.filter(x => SECM[x.sec]?.ch === numCh);
  TTS.speak(list.map(x => `${x.item}。${x.num}。`).join(""));
}
function Numbers() {
  if (!NUMS.length) return `<div class="card">数字まとめは準備中です。</div>`;
  const list = NUMS.filter(x => SECM[x.sec]?.ch === numCh);
  return `<div class="card"><h2>🔢 数字まとめ</h2><div class="small">本番は数字のひっかけが多い試験です。「答えを隠す」にすると、タップするまで数字が見えないので暗記テストになります。</div>
    <div class="row mt" style="gap:6px;flex-wrap:wrap">${CHAPS.map(c => `<button class="chip" style="border:0;padding:6px 12px;font-size:13px;${numCh === c.ch ? "background:var(--brand);color:#fff" : ""}" onclick="numCh=${c.ch};numOpen={};render()">CH${c.ch}</button>`).join("")}
      <span class="grow"></span><button class="linkbtn" onclick="numHide=!numHide;numOpen={};render()">${numHide ? "答えを表示" : "答えを隠す"}</button></div>
    ${TTS.ok ? `<div class="mt"><button class="btn sec" onclick="sayNums()">🎧 CH${numCh}の数字を通しで聞く</button></div>` : ""}</div>
  <div class="card">${list.map((x, i) => { const shown = !numHide || numOpen[i];
    return `<div style="border-top:${i ? "1px solid var(--line)" : "0"};padding:9px 0" ${numHide ? `onclick="numOpen[${i}]=!numOpen[${i}];render()"` : ""}>
      <div class="small"><b class="num">${esc(x.sec)}</b> ${esc(SECM[x.sec]?.title || "")}</div>
      <div style="font-weight:700;font-size:14.5px;margin-top:2px">${esc(x.item)}</div>
      <div style="font-size:15px;margin-top:2px;color:${shown ? "var(--brand)" : "var(--sub)"}">${shown ? esc(x.num) : "（タップで表示）"}</div>
      ${shown && x.tip ? `<div class="small">💡 ${esc(x.tip)}</div>` : ""}</div>`; }).join("") || `<div class="small">この章の数字はまだありません。</div>`}</div>
  <div class="center"><button class="linkbtn" onclick="go('book')">◀ 教科書に戻る</button></div>`;
}

// ---------- 起動 ----------
(async () => {
  renderTabs();
  await loadQuestions();
  if (S.cur && !S.cur.done) view = "mock";
  else if (S.pastCur && !S.pastCur.done && S.pastCur.pick.some(x => x != null)) view = "past";
  render();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
